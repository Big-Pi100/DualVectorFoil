<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SoulKeep 触屏布局对照：现状 vs 《重生细胞》参考</title>
<style>
  :root{
    --ink:#0a0908; --paper:#0f0d0c;
    --gold:#e8d9a8; --dim:#8d8478; --line:rgba(232,226,210,.14);
    --warm:#ffd75e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#050506;color:#cfc7b6;
    font:13px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  #frame{position:relative;width:960px;height:540px;transform-origin:center;flex:0 0 auto}
  #stage{position:absolute;inset:0;overflow:hidden;border-radius:6px;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(120,80,40,.16), transparent 60%),
      radial-gradient(80% 60% at 12% 88%, rgba(90,120,140,.10), transparent 70%),
      linear-gradient(180deg,#12100f 0%,#0b0a09 60%,#080706 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.8)}
  #stage::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%)}

  /* ---------- 场景占位：让人判断"会不会挡住" ---------- */
  .scenery{position:absolute;inset:0;pointer-events:none;opacity:.5}
  .floor{position:absolute;left:0;right:0;bottom:0;height:96px;
    background:linear-gradient(180deg,rgba(58,52,44,.55),rgba(22,20,18,.9))}
  .floor::before{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,transparent 0 47px,rgba(0,0,0,.35) 47px 48px)}
  .hero{position:absolute;left:238px;bottom:92px;width:34px;height:96px;
    background:linear-gradient(180deg,#c8bda4,#7a6f5e);border-radius:6px 6px 3px 3px}
  .hero::after{content:'';position:absolute;left:6px;top:-26px;width:22px;height:22px;
    border-radius:50%;background:#d8cbb0}
  .lantern{position:absolute;left:330px;bottom:214px;width:16px;height:24px;border-radius:3px;
    background:radial-gradient(circle at 50% 45%,#ffe6a8,#c98f3a);box-shadow:0 0 26px 12px rgba(255,200,110,.18)}

  /* ---------- 顶部资源 ---------- */
  #top{position:absolute;left:16px;top:12px;font-size:12px;letter-spacing:.5px;color:var(--dim)}
  #hp{position:relative;width:300px;height:13px;margin-top:3px;border-radius:2px;
    background:rgba(255,255,255,.06);overflow:hidden}
  #hp i{position:absolute;inset:0;width:68%;background:linear-gradient(90deg,#b8352c,#e06a52)}
  #hpN{position:absolute;right:6px;top:-16px;font-size:11px;color:#d8ccb2;letter-spacing:1px}
  #inkwrap{position:relative;width:300px;height:7px;margin-top:5px;border-radius:2px;
    background:rgba(255,255,255,.06);overflow:hidden}
  #inkwrap i{position:absolute;inset:0;width:76%;background:linear-gradient(90deg,#3a4d5e,#7fa8c8)}
  #room{position:absolute;left:16px;top:96px;font-size:13px;letter-spacing:3px;color:#b3a992}

  /* ---------- 摇杆 ---------- */
  #stick{position:absolute;left:56px;bottom:52px;width:118px;height:118px;border-radius:50%;
    border:1px solid rgba(232,226,210,.18);background:rgba(255,255,255,.03);pointer-events:none}
  #stick b{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;
    border-radius:50%;background:rgba(232,226,210,.16);border:1px solid rgba(232,226,210,.3)}
  #sticklabel{position:absolute;left:56px;bottom:24px;width:118px;text-align:center;
    font-size:11px;color:#5f584e;letter-spacing:2px}

  /* ---------- 通用按钮 ---------- */
  .btn{position:absolute;border-radius:50%;border:1px solid rgba(232,226,210,.30);
    background:rgba(20,18,16,.72);color:#e4dbc6;display:flex;align-items:center;justify-content:center;
    user-select:none;cursor:pointer;letter-spacing:1px;
    transition:background .08s,border-color .08s,transform .06s}
  .btn.on{background:rgba(255,215,94,.26);border-color:rgba(255,215,94,.9);color:#fff6d8;transform:scale(.96)}
  .btn em{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);
    font-style:normal;font-size:9px;letter-spacing:1px;color:#a89f8d;line-height:1}

  /* ---------- 装备槽 ---------- */
  .slot{position:absolute;right:14px;width:62px;height:62px;border-radius:7px;
    border:1px solid rgba(232,226,210,.22);background:linear-gradient(180deg,rgba(30,26,22,.9),rgba(14,12,10,.92));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    color:#e4dbc6;cursor:pointer;user-select:none;transition:border-color .08s,transform .06s}
  .slot b{font-size:15px;font-weight:600;letter-spacing:2px;line-height:1}
  .slot s{text-decoration:none;font-size:8px;color:#8d8478;letter-spacing:1px}
  .slot.on{border-color:rgba(255,215,94,.85);transform:scale(.96)}
  .slot.empty{color:#6e675c;border-style:dashed;border-color:rgba(232,226,210,.18)}
  .slot .ring{position:absolute;inset:-1px;border-radius:7px;pointer-events:none;
    background:conic-gradient(rgba(255,215,94,.55) var(--p,0%), transparent 0);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
    opacity:0;transition:opacity .15s}
  .slot.cooling .ring{opacity:1}

  /* ---------- 对照组：旧的 7 键 ---------- */
  .old{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.07);color:#d6ccb4;display:flex;align-items:center;justify-content:center;
    font-size:13px;cursor:pointer;user-select:none}
  .old.big{font-size:19px}

  /* ---------- 底部条 ---------- */
  #bar{display:flex;gap:10px;align-items:center;font-size:12px;color:#8d8478}
  #bar button{font:inherit;font-size:12px;padding:6px 14px;border-radius:18px;cursor:pointer;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#cfc7b6}
  #bar button.on{border-color:rgba(255,215,94,.7);background:rgba(255,215,94,.14);color:#ffe9a8}
  #hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    font-size:11px;color:#6b6459;letter-spacing:1px;white-space:nowrap;pointer-events:none}

  /* ---------- 拇指可达范围 ---------- */
  #reach{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s}
  #reach.show{opacity:1}
  #reach i{position:absolute;right:-40px;bottom:-40px;width:300px;height:300px;border-radius:50%;
    border:1px dashed rgba(120,200,255,.5);background:rgba(90,160,220,.06)}
  #reach i+i{width:210px;height:210px;border-color:rgba(120,255,180,.5);background:rgba(90,220,150,.05)}
  /* 标注不放进画面：它一定会压在装备格上。写进按钮文案里更稳。 */
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <div id="stage">
      <div class="scenery">
        <div class="floor"></div><div class="hero"></div><div class="lantern"></div>
      </div>

      <div id="top">
        <div id="hpN">174 / 248</div>
        <div id="hp"><i></i></div>
        <div id="inkwrap"><i></i></div>
      </div>
      <div id="room">废 墟 回 廊</div>

      <div id="stick"><b></b></div>
      <div id="sticklabel">左 摇 杆</div>

      <div id="reach"><i></i><i></i></div>

      <!-- 由脚本填充 -->
      <div id="oldLayer"></div>
      <div id="newLayer"></div>

      <div id="hint">按住任一按钮看高亮 · 装备格点一下有冷却/耗墨反馈</div>
    </div>
  </div>

  <div id="bar">
    <button id="tOld">现状：7 个同质按钮</button>
    <button id="tNew" class="on">参考《重生细胞》：3 动作键 + 4 装备格</button>
    <button id="tReach">显示拇指可达范围（外圈＝勉强够到）</button>
  </div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), oldLayer = $('#oldLayer'), newLayer = $('#newLayer');

  /* ============ 方案 A：现状 —— 7 个按钮，全部长一样 ============ */
  const OLD = [
    { id:'back', t:'后跃', x:60,  y:176, s:52, f:'12px' },
    { id:'flat', t:'纸',   x:190, y:112, s:58, f:'14px' },
    { id:'red',  t:'红',   x:104, y:96,  s:64, f:'13px' },
    { id:'blue', t:'蓝',   x:30,  y:104, s:64, f:'13px' },
    { id:'atk',  t:'攻',   x:100, y:8,   s:80, f:'17px' },
    { id:'jump', t:'跳',   x:0,   y:0,   s:92, f:'19px' },
  ];
  function drawOld(){
    oldLayer.innerHTML = OLD.map(b =>
      `<div class="old${b.s>=80?' big':''}" data-k="${b.id}"
        style="right:${b.x}px;bottom:${b.y}px;width:${b.s}px;height:${b.s}px;font-size:${b.f}">${b.t}</div>`
    ).join('') +
    `<div class="old" style="right:14px;top:12px;width:34px;height:34px;font-size:11px;border-radius:6px;opacity:.5">匣</div>`;
    bindAll(oldLayer, '.old');
  }

  /* ============ 方案 B：《重生细胞》参考 ============ */
  // 3 个动作键：拇指落点，最大
  const ACTS = [
    { id:'jump', t:'跳',   x:16,  y:16,  s:92, f:'19px' },
    { id:'roll', t:'翻滚', x:116, y:20,  s:80, f:'15px' },
    { id:'use',  t:'交互', x:202, y:64,  s:64, f:'13px' },
  ];
  // 4 个装备格：屏幕右缘竖排
  const SLOTS = [
    { t:'红', sub:'点按 · 墨12', cls:'' },
    { t:'蓝', sub:'按住 · 持续',  cls:'' },
    { t:'纸', sub:'按住 · 侧身',  cls:'' },
    { t:'—',  sub:'未装备',      cls:'empty' },
  ];
  function drawNew(){
    const acts = ACTS.map(b =>
      `<div class="btn" data-k="${b.id}"
        style="right:${b.x}px;bottom:${b.y}px;width:${b.s}px;height:${b.s}px;font-size:${b.f}">${b.t}</div>`
    ).join('');
    const slots = SLOTS.map((s,i) =>
      `<div class="slot ${s.cls}" data-s="${i}" style="top:${74+i*70}px">
         <div class="ring"></div><b>${s.t}</b><s>${s.sub}</s>
       </div>`
    ).join('');
    newLayer.innerHTML = acts + slots;
    bindAll(newLayer, '.btn');
    bindSlots();
  }

  /* 按下高亮 + 装备格的"耗墨/冷却"演示 */
  function bindAll(root, sel){
    root.querySelectorAll(sel).forEach(el => {
      const on = e => { e.preventDefault(); el.classList.add('on'); };
      const off = () => el.classList.remove('on');
      el.addEventListener('pointerdown', on);
      el.addEventListener('pointerup', off);
      el.addEventListener('pointercancel', off);
      el.addEventListener('pointerleave', off);
    });
  }
  function bindSlots(){
    newLayer.querySelectorAll('.slot').forEach(el => {
      if (el.classList.contains('empty')) return;
      el.addEventListener('pointerdown', e => {
        e.preventDefault();
        el.classList.add('on');
        const ring = el.querySelector('.ring');
        if (el.dataset.s === '0'){          // 红魂：一次性耗墨，演示 620ms 回冲
          el.classList.add('cooling');
          let t0 = performance.now();
          (function tick(now){
            const p = Math.min(100,(now-t0)/620*100);
            ring.style.setProperty('--p', p+'%');
            if (p < 100) requestAnimationFrame(tick);
            else { el.classList.remove('cooling'); ring.style.setProperty('--p','0%'); }
          })(t0);
        } else {                            // 按住类：不做冷却，只做压感
          el.dataset.hold = 1;
        }
      });
      const up = () => el.classList.remove('on');
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('pointerleave', up);
    });
  }

  /* ============ 切换 ============ */
  let mode = 'new';
  const tOld = $('#tOld'), tNew = $('#tNew');
  function render(){
    oldLayer.style.display = mode === 'old' ? 'block' : 'none';
    newLayer.style.display = mode === 'new' ? 'block' : 'none';
    tOld.classList.toggle('on', mode === 'old');
    tNew.classList.toggle('on', mode === 'new');
  }
  tOld.onclick = () => { mode = 'old'; render(); };
  tNew.onclick = () => { mode = 'new'; render(); };
  $('#tReach').onclick = function(){
    $('#reach').classList.toggle('show');
    this.classList.toggle('on');
  };

  /* ============ 自适应缩放 ============ */
  function fit(){
    const s = Math.min((innerWidth - 40) / 960, (innerHeight - 120) / 540, 1);
    $('#frame').style.transform = 'scale(' + s + ')';
    $('#frame').style.marginBottom = (540 * (s - 1)) + 'px';
  }
  addEventListener('resize', fit);

  drawOld(); drawNew(); render(); fit();
})();
</script>
</body>
</html>
