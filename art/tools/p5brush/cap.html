<!doctype html>
<meta charset="utf-8">
<title>p5.brush capability sheet</title>
<body style="margin:0;background:#E8DCBE">
<script type="module">
import * as brush from '../../../.deps/p5.brush/dist/brush.esm.js';

/* 能力谱系样张：只用我们 12 色板 + 炭黑。
 * 目的不是好看，是"看边界"：哪些能交，哪些不能。 */
const W = 1240, H = 860;
const C = {
  paper: '#E8DCBE', grey: '#8C8B84', charcoal: '#2B2320', umber: '#6B4B32',
  blue: '#1F2E5C', slate: '#4C6E8C', ochre: '#B98A2E', red: '#9B2226',
  moss: '#4F6B3A',
};
const BRUSHES = ['pen', 'rotring', '2H', 'HB', '2B', 'cpencil',
                 'charcoal', 'crayon', 'pastel', 'marker', 'spray'];

const t0 = performance.now();
try {
  brush.createCanvas(W, H);
  brush.seed(77); brush.noiseSeed(77);
  brush.angleMode(brush.DEGREES);
  brush.clear(C.paper);
  brush.translate(-W / 2, -H / 2);
  brush.scaleBrushes(2.0);

  /* ── A. 笔刷谱系：每行四笔 —— 直线 / 转折 / 重笔叠深 / 小圆 ────── */
  // 行距 26、笔宽 1.2：上一版 16px 行距 + 1.6 宽，11 行糊成一片
  BRUSHES.forEach((nm, i) => {
    const y = 28 + i * 26;
    brush.set(nm, C.charcoal, 1.2);
    brush.line(60, y, 400, y);
    brush.set(nm, C.umber, 1.2);
    brush.line(420, y, 490, y - 8);
    brush.line(490, y - 8, 560, y + 7);
    brush.set(nm, C.blue, 2.6);
    brush.line(580, y, 720, y);
    brush.set(nm, C.red, 1.4);
    brush.circle(770, y, 11, 0.35);
  });

  /* ── B. 涂面：同一块矩形，6 种填法 ─────────────────────────────── */
  const bx = 60, by = 330, bw = 168, bh = 150, gap = 12;
  // ① 水彩 fill：柔和、有边界沉积，但不是蜡笔
  brush.noStroke();
  brush.fill(C.slate, 195);
  brush.fillBleed(0.35, 'out', null, 0.5);
  brush.fillTexture(0.55, 0.6, true, 0.15);
  brush.rect(bx, by, bw, bh);
  brush.noFill();
  // ② mass crayon strength .55
  brush.mass('crayon', C.umber, { strength: 0.55, precision: 0.8 });
  brush.rect(bx + (bw + gap), by, bw, bh);
  // ③ mass crayon strength 1
  brush.mass('crayon', C.umber, { strength: 1.0, precision: 0.8 });
  brush.rect(bx + (bw + gap) * 2, by, bw, bh);
  // ④ mass pastel（更软更粉）
  brush.mass('pastel', C.ochre, { strength: 0.9, precision: 0.8 });
  brush.rect(bx + (bw + gap) * 3, by, bw, bh);
  // ⑤ mass 带 outline
  brush.mass('crayon', C.grey, { strength: 0.85, precision: 0.9, outline: true });
  brush.rect(bx + (bw + gap) * 4, by, bw, bh);
  brush.noMass();
  // ⑥ hatch 排线（交叉用两组不同角度，各自整块）
  brush.hatchStyle('crayon', C.moss, 2.0);
  brush.hatch(7, 38, { rand: 0.25 });
  brush.rect(bx + (bw + gap) * 5, by, bw, bh);
  brush.hatch(7, -38, { rand: 0.25 });
  brush.rect(bx + (bw + gap) * 5, by, bw, bh);
  brush.noHatch();

  /* ── C. 变形与场 ───────────────────────────────────────────────── */
  const cy = 530;
  // ① 无场 / wiggle(1)
  brush.set('crayon', C.charcoal, 1.8);
  brush.noField();
  brush.line(60, cy, 340, cy);
  brush.wiggle(1.0);
  brush.line(60, cy + 22, 340, cy + 22);
  // ② 六个内置场
  ['curved', 'zigzag', 'waves', 'seabed', 'spiral', 'columns'].forEach((f, i) => {
    brush.field(f);
    brush.line(60 + i * 48, cy + 54, 96 + i * 48, cy + 54);
  });
  brush.noField();

  // ③ circle 的 r：0 / 0.5 / 1
  [0, 0.5, 1.0].forEach((r, i) => {
    brush.set('crayon', C.red, 2.2);
    brush.circle(410 + i * 76, cy + 22, 28, r);
  });

  // ④ spline 逐点压力（这一条 Python 版没有）
  brush.set('crayon', C.blue, 2.6);
  brush.spline([[660, cy + 4, 0.15], [710, cy + 48, 1.0], [770, cy + 2, 0.3],
                [830, cy + 52, 1.2], [890, cy + 8, 0.2]], 0.25);

  // ⑤ clip：排线只出现在框内（做遮罩用）
  brush.set('crayon', C.charcoal, 1.6);
  brush.rect(930, cy - 14, 230, 116);
  brush.clip([930, cy - 14, 1160, cy + 102]);
  brush.hatchStyle('crayon', C.ochre, 3.0);
  brush.hatch(10, 52, { rand: 0.35 });
  for (let i = 0; i < 5; i++) brush.line(900, cy - 24 + i * 28, 1200, cy - 18 + i * 28);
  brush.noHatch();
  brush.noClip();

  /* ── D. 叠涂：蜡笔靠叠涂加深，不靠 opacity ─────────────────────── */
  const dy = 640;
  brush.mass('crayon', C.grey, { strength: 0.55, precision: 0.7 });
  brush.rect(60, dy, 520, 110);
  brush.noMass();
  brush.mass('crayon', C.umber, { strength: 0.55, precision: 0.7 });
  brush.rect(620, dy, 520, 110);
  brush.noMass();
  // 同一块上再盖两遍：看能否靠叠涂变深（保持笔触，不糊成色块）
  brush.mass('crayon', C.charcoal, { strength: 0.6, precision: 0.85 });
  brush.rect(660, dy + 20, 200, 70);
  brush.noMass();
  brush.mass('crayon', C.umber, { strength: 0.6, precision: 0.85 });
  brush.rect(900, dy + 20, 200, 70);
  brush.noMass();
  // 再盖第三遍，验证"越叠越深"是否收敛到饱和
  brush.mass('charcoal', C.charcoal, { strength: 0.9, precision: 0.9 });
  brush.rect(900, dy + 40, 200, 50);
  brush.noMass();

  brush.render();
  window.__ms = Math.round(performance.now() - t0);
  window.__ok = true;
} catch (e) {
  window.__err = String((e && e.stack) || e);
  console.error('BRUSH_FAIL', e);
}
</script>
