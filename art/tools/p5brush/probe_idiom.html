<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#222">
<script type="module">
import * as brush from '../../../.deps/p5.brush/dist/brush.esm.js';
/* 纯库惯用法探针：mass 铺底 + hatch 斜排线，全部 4 倍超采样后降采样。
 * 不再手搓 stroke 循环 —— mass/hatch 就是 p5.brush 自己的"填一块蜡笔"方式。 */

const U = 192, PAPER = '#E8DCBE';
const q = new URLSearchParams(location.search);
const SS = +(q.get('ss') || 4);
const v = +(q.get('v') || 0);
const N = U * SS;

let s = 1;
const srnd = k => { s = (k >>> 0) || 1; };
const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };

const CFG = [
  // 底 strength   hatch 间距(u)   笔径(u)   暗色
  [0.15, 4.4, 1.0, '#8A8574'],
  [0.15, 3.8, 1.2, '#8A8574'],
  [0.00, 4.6, 1.1, '#7E7968'],
  [0.25, 4.2, 1.3, '#6F6A58'],
];

try {
  const [st, gap, w, c2] = CFG[v];
  const bc = '#C6BB9B';
  srnd(4101 + v * 23);
  brush.createCanvas(N, N);
  brush.angleMode(brush.DEGREES);
  brush.clear(PAPER);
  brush.translate(-N / 2, -N / 2);

  const W = N, H = N;
  if (st > 0) {
    brush.mass('crayon', bc, { strength: st, precision: 0.72 });
    brush.rect(0, 0, W, H); brush.noMass();
  }
  brush.hatchStyle('crayon', '#7C7767', w * SS);
  brush.hatch(gap * SS, -38, { rand: 0.45 });
  brush.rect(0, 0, W, H);
  // 第二遍：错开角度与间距，破掉机械等距
  brush.hatchStyle('crayon', c2, w * 1.5 * SS);
  brush.hatch(gap * 2.4 * SS, -33, { rand: 0.6 });
  brush.rect(0, 0, W, H);
  brush.noHatch();

  brush.render();
  window.__ok = true;
} catch (e) { window.__err = String(e && e.stack || e); console.error(e); }
</script>
