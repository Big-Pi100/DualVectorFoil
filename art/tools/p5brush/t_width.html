<!doctype html><meta charset="utf-8"><body style="margin:0">
<script type="module">
import * as brush from '../../../.deps/p5.brush/dist/brush.esm.js';
brush.add('wax', { weight: 0.33, scatter: 0.72, sharpness: 0.75, grain: 2,
                   opacity: 159, spacing: 0.07, pressure: [1.1, 0.9],
                   type: 'default', rotate: 'natural', markerTip: true, noise: 1 });
const N = 192*4;
try{
brush.createCanvas(N,N); brush.angleMode(brush.DEGREES); brush.clear('#E8DCBE'); brush.translate(-N/2,-N/2);
const WS=[0.8,1.0,1.2,1.4,1.8,2.4];
WS.forEach((w,i)=>{
  const y=(24+i*28)*4;
  brush.set('wax','#8A8574',w*4);
  brush.line(20*4,y,172*4,y);
  brush.set('wax','#000000',0.0001); // flush
});
brush.render(); window.__ok=true;
}catch(e){window.__err=String(e&&e.stack||e);}
</script>
