<!doctype html>
<meta charset="utf-8">
<body style="margin:0">
<script type="module">
import * as brush from '../../../.deps/p5.brush/dist/brush.esm.js';
/* 瓦片生成器 v2 —— **超采样**版（2026-11-25 v12）。
 *
 * ## 为什么另起一个文件
 * 旧的 tilegen.html 的所有变体都在 1 倍画布上直接画，结论是"怎么调都不像蜡笔"。
 * 根因不是参数，是**分辨率**：内置 crayon 的笔尖直径 = 0.33·w、
 * 横向散布 ≈ 1.4·w（scatter 1.9）。要 4.4u 的排线周期，1 倍画布上 w 只能给 0.6px
 * —— 亚像素，点直接被抹掉；给到 4px 又糊成一条 15px 宽的雾。
 *
 * 而参考图（生图砖块）是 **1024 原生、压到 96px 用**，也就是 7 倍降采样。
 * 它那些"细笔触"本来就是 7 倍降采样的产物。所以在 1 倍画布上追它是死路。
 *
 * 这里改成：**在 4 倍画布上画，最后降采样回 192**。
 * 笔径 1.0u = 4px 是真实像素，crayon 的颗粒能被画出来，
 * 降采样把 4px 的点平均成 1px 的细颗粒 —— 这才是参考图的物理过程。
 *
 * ## 结构（沿用 v11 的结论）
 * 整面一遍，笔跨过砖缝；缝是涂完之后勾上去的，不是逐块涂出来的。
 */
const q = new URLSearchParams(location.search);
const kind = q.get('kind') || 'wall';
const S = +(q.get('seed') || 0);
const SS = +(q.get('ss') || 6);          // 超采样倍数（生图是 6.7x 降采样）
const MODE = q.get('m') || 'idiom';      // idiom=库惯用法(mass+hatch，默认)  hatch/scrib/dash=实验
const K = +(q.get('k') || 4);            // 参数档（idiom 默认 4）
const NR = +(q.get('nr') || 9);         // 只用前 NR 组行（调试）
const ACC = +(q.get('acc') || 1);       // 是否画重压笔（调试）
const VL = +(q.get('vl') || 0.5);       // 浅色罩染强度 0~1
const NP = +(q.get('np') || 9);         // 平铺次数（调试：1=只画中心）

const U = kind === 'slab' ? 48 : 192;    // 瓦片尺寸（u）
const V = kind === 'floor' ? 48 : (kind === 'slab' ? 20 : 192);
const N = U * SS, M = V * SS;            // 画布尺寸（px）

const P = { paper:'#E8DCBE', charcoal:'#2B2320', cold:'#8C8B84',
            umber:'#6B4B32', ochre:'#B98A2E', moss:'#4F6B3A' };

let s = 1;
const srnd = k => { s = (k >>> 0) || 1; };
const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };

/* ── 料子 ────────────────────────────────────────────────────────────
 * 三件事叠出"干蜡笔"：
 *   ① 极淡的底（mass 0.15）—— 只为让浅缝不是纯纸色，比纸暗一点点
 *   ② 主排线（crayon，间距 4.4u，笔径 1.0u）—— 1 倍画布上这是 0.25px，画不出来
 *   ③ 第二遍错角（-33°，间距 2.4 倍）—— 破掉等距，手画不出完美平行
 *   ④ 稀疏乱笔 —— 蜡笔在砖上蹭的时候不可能只有方向，破机械感 */
function field(w, h) {
  brush.mass('crayon', '#C6BB9B', { strength: 0.15, precision: 0.70 });
  brush.rect(0, 0, w, h); brush.noMass();

  brush.hatchStyle('crayon', '#837E6C', 1.0 * SS);
  brush.hatch(4.1 * SS, -38, { rand: 0.45 });
  brush.rect(0, 0, w, h);

  brush.hatchStyle('crayon', '#837E6C', 1.6 * SS);
  brush.hatch(10.2 * SS, -33, { rand: 0.60 });
  brush.rect(0, 0, w, h);
  brush.noHatch();

  // 乱笔：120 道很短的蹭痕，方向 ±30° 内散
  for (let i = 0; i < 330; i++) {
    const x = rnd() * w / SS, y = rnd() * h / SS;
    const a = -0.66 + (rnd() - 0.5) * 1.0;
    const len = 2 + rnd() * 7;
    brush.set('crayon', rnd() < 0.4 ? '#666150' : '#7E7967', (0.8 + rnd() * 1.3) * SS);
    brush.line(x * SS, y * SS, (x + Math.cos(a) * len) * SS, (y + Math.sin(a) * len) * SS);
  }
}

/* ── 乱涂场 ──────────────────────────────────────────────────────────
 * 人拿蜡笔涂一块面是**来回蹭**，不是画平行线：笔短、方向反复偏、来回压同一处。
 * 参考图 1:1 看就是这个结构 —— 暗部是一团团乱毛，浅色是长条的"擦"痕。
 * 所以这里：暗部 = 短笔乱涂（密），浅带 = 长笔连擦（少而连续）。 */
function fieldScrib(w, h) {
  const W = w / SS, H = h / SS;
  brush.mass('crayon', '#C6BB9B', { strength: 0.12, precision: 0.70 });
  brush.rect(0, 0, w, h); brush.noMass();

  // 乱涂：620 笔。七成在主方向 ±22° 内，三成完全随机 —— 那三成就是"乱毛"。
  for (let i = 0; i < 620; i++) {
    const x = rnd() * W, y = rnd() * H;
    const a = rnd() < 0.72 ? -0.62 + (rnd() - 0.5) * 0.78
                          : (rnd() - 0.5) * 6.283;
    const len = 4 + rnd() * 13;
    brush.set('crayon', rnd() < 0.3 ? '#6A6553' : '#837E6C', (1.4 + rnd() * 2.2) * SS);
    brush.line(x * SS, y * SS, (x + Math.cos(a) * len) * SS, (y + Math.sin(a) * len) * SS);
  }
  // 浅色长擦：连续（cut 0.05），只在主方向，把暗部擦出一条条浅带
  for (const [per, lw, col, cut, ang] of [[4.6, 2.0, '#DCD0B0', 0.05, -38],
                                          [11.0, 2.6, '#E3D7B7', 0.10, -33]]) {
    const a = ang * Math.PI / 180;
    const dx = Math.cos(a), dy = Math.sin(a), nx = -dy, ny = dx;
    const diag = Math.hypot(W, H);
    for (let o = -diag; o <= diag; o += per * (0.88 + rnd() * 0.2)) {
      const cx = W / 2 + nx * o, cy = H / 2 + ny * o;
      const L = diag * 1.35;
      let t = -L / 2 + rnd() * per;
      while (t < L / 2) {
        const end = Math.min(L / 2, t + 30 + rnd() * 70);
        if (rnd() > cut) {
          brush.set('HB', col, lw * (0.85 + rnd() * 0.3) * SS);
          brush.line((cx + dx * t) * SS, (cy + dy * t) * SS,
                     (cx + dx * end) * SS, (cy + dy * end) * SS);
        }
        t = end + rnd() * per * 0.8;
      }
    }
  }
}

/* ## 关于笔刷：回到原厂 crayon，一个参数都不改
 *
 * 先前我加了一个自定义 'wax'（scatter 0.30 / sharpness 0.60），理由是"几何放不下"。
 * 错。那不是在复现蜡笔，是在**把蜡笔改没**：scatter 是 crayon 的颗粒来源，
 * 把 1.9 压到 0.30 之后，笔触变成干净的实线 —— 白哥一句
 * "完全看不出来 p5.brush 原来的设定" 说到了根上。
 *
 * 真正的解法不是改笔，是**提高超采样倍数**：
 * 生图砖是 642px 原生压到 96px（约 6.7× 降采样），颗粒是在降采样中形成的。
 * 我们只在 4× 画布上画，原厂 crayon 的 0.33w 笔尖只有 1.3px，颗粒还没展开就被压平。
 * 提到 6~8×，笔尖有 2~3px 真实像素，原厂颗粒才能在降采样后留下飞白。
 */
/* dash 参数档：[底 strength, rows] —— rows 每项 [周期, 角度, w0, w1, [断长], [空长], 色] */
const DASH_CFG = [
  [0.12, [[4.4, -38, 1.4, 1.8, [12, 24], [2, 6], '#87826F'],
          [8.8, -34, 1.7, 2.1, [14, 30], [5, 12], '#7C7765']]],
  [0.00, [[4.4, -38, 1.2, 1.6, [12, 24], [2, 6], "#8A8574"],
          [8.8, -34, 1.5, 1.9, [14, 30], [5, 12], '#7E7967']]],
  [0.00, [[4.6, -38, 1.2, 1.6, [12, 26], [2, 6], '#A39D88'],
          [9.2, -34, 1.5, 1.9, [14, 30], [5, 12], '#948E79']]],
  [0.12, [[4.4, -38, 1.2, 1.6, [12, 24], [1, 4], '#A8A28C'],
          [8.8, -34, 1.4, 1.8, [14, 30], [3, 8], '#9C9681']]],
  [0.12, [[6.5, -38, 1.3, 1.7, [12, 24], [2, 6], '#A39D88'],
          [13.0, -34, 1.6, 2.0, [14, 30], [5, 12], '#948E79']]],
  [0.12, [[9.0, -38, 1.4, 1.8, [12, 24], [2, 6], '#A39D88'],
          [18.0, -34, 1.7, 2.1, [14, 30], [5, 12], '#948E79']]],
  [0.00, [[7.0, -38, 1.3, 1.7, [12, 26], [4, 9], '#87826F'],
          [14.0, -34, 1.6, 2.0, [14, 32], [7, 15], '#7C7765']]],
  [0.00, [[8.4, -38, 1.3, 1.7, [12, 26], [4, 9], '#87826F'],
          [16.8, -34, 1.6, 2.0, [14, 32], [7, 15], '#7C7765']]],
  /* ↓ 原厂 crayon：笔色按合成后目标反推。opacity 159 → 0.624·笔色 + 0.376·纸(224)
   *   目标暗线 L≈105 → 笔色 L≈(105-84)/0.624 ≈ 34?? 不对：多次叠加会继续变暗，
   *   实测 '#6E6957'(L≈107) 单笔合成后 ≈150，两三笔叠加到 ≈110，正好。 */
  [0.00, [[3.0, -38, 0.45, 0.65, [5, 12], [2, 5], '#6E6957'],
          [6.0, -33, 0.55, 0.80, [6, 14], [3, 7], '#7A7563']]],
  [0.00, [[3.6, -38, 0.50, 0.70, [5, 12], [2, 5], '#6E6957'],
          [7.2, -33, 0.60, 0.85, [7, 15], [3, 8], '#7A7563']]],
  [0.00, [[4.3, -38, 0.55, 0.75, [6, 14], [2, 6], '#645F4F'],
          [8.6, -33, 0.65, 0.90, [7, 16], [4, 9], '#736E5C']]],
  [0.00, [[3.0, -38, 0.40, 0.55, [4, 10], [1, 4], '#7A7563'],
          [6.0, -33, 0.50, 0.70, [6, 14], [3, 7], '#84806D']]],
];

/* ── 库惯用法场：mass 轻铺 + hatch 两遍 ──────────────────────────────
 * 生图 1:1 量的其实是**通长细斜线**（跨砖宽 60~80%，间距 4.3u），
 * 不是短笔断续 —— 短笔那版"斑驳"就是这么来的。
 * 这里完全用 p5.brush 自己的 hatch（内部走 stroke.line + 原厂 crayon），
 * 不改任何笔刷参数。颗粒/飞白来自 crayon 自己，密度来自 hatch 的间距。 */
const HATCH_CFG = [
  // mass, gap1, w1, col1, gap2, w2, col2
  [0.15, 4.4, 1.0, '#8A8574', 10.6, 1.5, '#7C7767'],
  [0.12, 4.0, 1.1, '#8A8574',  9.6, 1.6, '#7C7767'],
  [0.18, 4.6, 1.0, '#948E79', 11.0, 1.4, '#86816F'],
  [0.00, 3.8, 0.9, '#8A8574',  9.0, 1.3, '#7C7767'],
  /* 更密：生图 96px 砖上约 30 条线 → gap 2~3u，w ≤0.7u */
  [0.10, 2.4, 0.55, '#8A8574', 5.0, 0.8, '#7C7767'],
  [0.10, 3.0, 0.60, '#8A8574', 6.0, 0.9, '#7C7767'],
  /* 交叉加密 + 暖色：生图 RGB 156/142/120，偏暖棕不是灰 */
  [0.10, 2.6, 0.52, '#907F66', 3.8, 0.62, '#7D6E58'],
  [0.08, 2.4, 0.50, '#94836A', 3.4, 0.58, '#806F59'],
];
function fieldIdiom(w, h, k) {
  const [st, g1, w1, c1, g2, w2, c2] = HATCH_CFG[k];
  if (st > 0) {
    brush.mass('crayon', '#C6BB9B', { strength: st, precision: 0.70 });
    brush.rect(0, 0, w, h); brush.noMass();
  }
  brush.hatchStyle('crayon', c1, w1 * SS);
  brush.hatch(g1 * SS, -38, { rand: 0.45 });
  brush.rect(0, 0, w, h);
  brush.hatchStyle('crayon', c2, w2 * SS);
  brush.hatch(g2 * SS, -33, { rand: 0.60 });
  brush.rect(0, 0, w, h);
  brush.noHatch();
}

/* ── 短笔断续场 ──────────────────────────────────────────────────────
 * 把生图砖块和自绘砖块并排一比，差别一眼就看出来了：
 *   生图的浅色**不是长条带**，是**短笔之间露出来的纸**。
 *   每截笔只有砖宽的 10~18%，缝和笔差不多长，而且相邻行的断口是错开的。
 * 所以：按行排（周期 4.4u），每行沿线走"画 7~15u、停 5~12u"的节奏。
 * 这条在 1 倍画布上做不出来 —— 7u 的短笔 + crayon 的 ±1.9w 散布 = 一团糊。
 * 4 倍画布上它是 28px 的真实短笔，降采样后正好是一条细蜡笔痕。 */
function fieldDash(w, h) {
  const W = w / SS, H = h / SS;
  const bs = DASH_CFG[K][0];
  if (bs > 0) {
    brush.mass('crayon', '#C6BB9B', { strength: bs, precision: 0.70 });
    brush.rect(0, 0, w, h); brush.noMass();
  }

  /* ‼ 笔径必须 ≤1.2u：crayon 的晕开半径是 3.8·w，4.5u 的行距撑不住 2u 的笔
   *   （第一版给 1.5~3.2u，整面糊成一块 99/10 的死灰）。 */
  const rows = DASH_CFG[K][1].slice(0, NR);
  for (const [per, angDeg, w0, w1, [l0, l1], [g0, g1], col] of rows) {
    const a = angDeg * Math.PI / 180;
    const dx = Math.cos(a), dy = Math.sin(a), nx = -dy, ny = dx;
    const diag = Math.hypot(W, H);
    for (let o = -diag; o <= diag; o += per * (0.85 + rnd() * 0.3)) {
      const cx = W / 2 + nx * o, cy = H / 2 + ny * o;
      const L = diag * 1.35;
      let t = -L / 2 + rnd() * 12;
      while (t < L / 2) {
        const len = l0 + rnd() * (l1 - l0);
        if (rnd() < 0.9) {
          const aa = a + (rnd() - 0.5) * 0.15;
          const x0 = cx + dx * t, y0 = cy + dy * t;
          brush.set('crayon', col, (w0 + rnd() * (w1 - w0)) * SS);
          brush.line(x0 * SS, y0 * SS,
                     (x0 + Math.cos(aa) * len) * SS, (y0 + Math.sin(aa) * len) * SS);
        }
        t += len + g0 + rnd() * (g1 - g0);
      }
    }
  }
  // 少数"重压"：一笔更黑，对应生图里偶尔的深点
  for (let i = 0; i < 44 * ACC; i++) {
    const x = rnd() * W, y = rnd() * H;
    const a = -0.66 + (rnd() - 0.5) * 0.5;
    const len = 4 + rnd() * 9;
    brush.set('crayon', '#7C7765', (1.0 + rnd() * 1.2) * SS);
    brush.line(x * SS, y * SS, (x + Math.cos(a) * len) * SS, (y + Math.sin(a) * len) * SS);
  }
}

/* 浅色罩染：横着再抹一层很淡的浅色。
 * 作用不是提亮，是**把纸白压下去**：短笔之间的缝原本是生纸（224），
 * 参考图的缝只有 191 —— 它的"白"是被蜡笔蹭过的白，不是生纸。
 * 这一层同时给出交叉方向的细颗粒，破掉单一斜向的机械感。 */
function veil(w, h, k) {
  if (k <= 0) return;
  brush.hatchStyle('crayon', '#EADFC1', (2.0 + 2.0 * k) * SS);
  brush.hatch((3.2 + 2.4 * k) * SS, 52, { rand: 0.5 });
  brush.rect(0, 0, w, h);
  brush.noHatch();
}

/* 暗斑：一小团短粗的蜡笔，模拟"这一块蹭重了"。
 * 均匀是手绘最大的破绽 —— 生图里明暗是一团一团的。 */
function blotches(w, h, n) {
  const W = w / SS, H = h / SS;
  for (let k = 0; k < n; k++) {
    const cx = rnd() * W, cy = rnd() * H;
    const m = 5 + Math.floor(rnd() * 7);
    for (let i = 0; i < m; i++) {
      const x = cx + (rnd() - 0.5) * 22, y = cy + (rnd() - 0.5) * 14;
      const a = -0.62 + (rnd() - 0.5) * 0.9;
      const len = 5 + rnd() * 14;
      brush.set('crayon', rnd() < 0.5 ? '#5F5A4A' : '#6E6957', (1.2 + rnd() * 1.8) * SS);
      brush.line(x * SS, y * SS, (x + Math.cos(a) * len) * SS, (y + Math.sin(a) * len) * SS);
    }
  }
}

/* ── 墙 ───────────────────────────────────────────────────────────── */
function wall() {
  const BW = 96, BH = 48;
  if (MODE === 'none') { /* 空场：只留缝 */ }
  else if (MODE === 'idiom') fieldIdiom(N, M, K);
  else if (MODE === 'scrib') fieldScrib(N, M);
  else if (MODE === 'dash') { fieldDash(N, M); veil(N, M, VL); }
  else { field(N, M); blotches(N, M, 14); }

  /* 逐块轻重：三成砖多蹭几笔。**不整块压暗**（那会变成补丁），
   * 只在砖内加几道更深的短笔 —— 和人补涂一样。 */
  for (let r = 0; r < 4; r++) {
    const off = (r % 2) * 48;
    for (let x = off - BW; x < U + BW; x += BW) {
      if (rnd() > 0.82) {
        const n = 2 + Math.floor(rnd() * 4);
        for (let i = 0; i < n; i++) {
          const px = x + 4 + rnd() * (BW - 8);
          const py = r * BH + 4 + rnd() * (BH - 8);
          const a = -0.66 + (rnd() - 0.5) * 0.5;
          const len = 3 + rnd() * 9;
          brush.set('crayon', '#89846F', (0.55 + rnd() * 0.65) * SS);
          brush.line(px * SS, py * SS, (px + Math.cos(a) * len) * SS, (py + Math.sin(a) * len) * SS);
        }
      }
    }
  }

  /* 砖的顶面 / 底面：顶面受光一道浅，底面压在缝上一道深。
   * 这是"砖"而不是"方块"的关键 —— 参考图的砖顶上有一条几乎白的亮边。 */
  for (let r = 0; r < 4; r++) {
    const off = (r % 2) * 48;
    for (let x = off - BW; x < U + BW; x += BW) {
      brush.set('HB', '#DED2B2', 1.7 * SS);
      brush.line((x + 6) * SS, (r * BH + 2.6) * SS, (x + BW - 6) * SS, (r * BH + 2.9) * SS);
      brush.set('HB', '#645C4B', 1.5 * SS);
      brush.line((x + 4) * SS, ((r + 1) * BH - 2.4) * SS, (x + BW - 4) * SS, ((r + 1) * BH - 2.7) * SS);
    }
  }

  /* 缝：HB 才有"硬一点的炭线"，crayon 的 1.9 散布会把 2px 的缝甩成虚雾。
   * 两遍：宽的一道是沟，窄的一道是沟底的暗。 */
  brush.set('HB', '#3A332C', 2.0 * SS);
  brush.wiggle(0.14);
  for (let r = 0; r <= 4; r++) brush.line(-6 * SS, r * BH * SS, (U + 6) * SS, r * BH * SS);
  for (let r = 0; r < 4; r++) {
    const off = (r % 2) * 48;
    for (let x = off; x < U + 0.1; x += BW) brush.line(x * SS, (r * BH + 2) * SS, x * SS, ((r + 1) * BH - 2) * SS);
  }
  brush.set('HB', '#241F1A', 0.9 * SS);
  for (let r = 0; r <= 4; r++) brush.line(-6 * SS, (r * BH + 0.7) * SS, (U + 6) * SS, (r * BH + 0.7) * SS);
  brush.noField();
}

try {
  brush.createCanvas(N, M);
  brush.angleMode(brush.DEGREES);
  brush.clear(P.paper);
  brush.translate(-N / 2, -M / 2);
  const TILES = [[0,0],[-U,0],[U,0],[0,-V],[0,V],[-U,-V],[-U,V],[U,-V],[U,V]].slice(0, NP);
  for (const [ox, oy] of TILES) {
    /* ‼ 每次重放前，**p5 的 seed 和自研 PRNG 都必须归零**。
     *   只重置 p5 的 seed 不够：短笔的坐标/长度/颜色全走自研 rnd()，
     *   9 次重放就成了 9 组不同的笔 → 密度 ×9，整面糊死。
     *   这就是"怎么调都太暗、改行距也没用"的真凶。 */
    brush.seed(3000 + S);
    brush.noiseSeed(4000 + S);
    srnd(9001 + S);
    brush.push();
    brush.translate(ox * SS, oy * SS);
    if (kind === 'wall') wall();
    brush.pop();
  }
  brush.render();
  window.__ok = true;
} catch (e) { window.__err = String(e && e.stack || e); console.error(e); }
</script>
