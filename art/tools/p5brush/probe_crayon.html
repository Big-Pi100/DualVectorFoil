<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#222">
<script type="module">
import * as brush from '../../../.deps/p5.brush/dist/brush.esm.js';
/* 只用**内置 crayon**，不定义任何自定义笔刷。
 * 目的：确认 p5.brush 原厂蜡笔在 192 瓦片尺度上到底长什么样，
 * 以及 `set(name, color, w)` 的 w 该给多少才等于参考图的 1.4px 线宽。 */

const N = 192;
const COLS = [3, 4.5, 6, 9];        // set 的 weight（× 内置 0.33 = 点径）
const PER = [1.0, 1.5, 2.1];        // 排线周期 = 点径 × 该倍数
const PAPER = '#E8DCBE';

let s = 1;
const srnd = k => { s = (k >>> 0) || 1; };
const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };

function hatchRect(x, y, w, h, col, sw, period, angDeg, passes) {
  const a = angDeg * Math.PI / 180;
  const dx = Math.cos(a), dy = Math.sin(a);
  const nx = -dy, ny = dx;
  const diag = Math.hypot(w, h);
  const L = diag * 1.3;
  brush.clip([x, y, w, h]);
  for (let p = 0; p < passes; p++) {
    // 每遍整体错开，第二三遍才不是把同一根线描粗
    const base = (p / passes) * period + (rnd() - 0.5) * period * 0.3;
    for (let o = -diag + base; o <= diag; o += period * (0.85 + rnd() * 0.3)) {
      const ang = a + (rnd() - 0.5) * 0.08;      // 改一笔
      const cx = x + w / 2 + nx * o;
      const cy = y + h / 2 + ny * o;
      const len = L * (0.55 + rnd() * 0.45);
      const t0 = (rnd() - 0.5) * (L - len);
      brush.set('crayon', col, sw * (0.85 + rnd() * 0.3));
      brush.line(cx + dx * t0 - dx * len / 2, cy + dy * t0 - dy * len / 2,
                 cx + dx * t0 + dx * len / 2, cy + dy * t0 + dy * len / 2);
    }
  }
  brush.noClip();
}

function cell(ox, oy, sw, period) {
  // 砖 96×48 居中
  const bx = ox + 48, by = oy + 72, bw = 96, bh = 48;
  // 黑描边：粗、糊、带角部溢出
  brush.clip([bx - 9, by - 9, bw + 18, bh + 18]);
  for (let i = 0; i < 2; i++) {
    brush.set('crayon', '#2B2320', 9 + i * 3);
    brush.line(bx - 4 + rnd() * 3, by - 4, bx + bw + 4, by - 3 + rnd() * 4);
    brush.line(bx + bw + 4, by - 3, bx + bw + 3, by + bh + 4);
    brush.line(bx + bw + 3, by + bh + 4, bx - 4, by + bh + 3);
    brush.line(bx - 4, by + bh + 3, bx - 4 + rnd() * 3, by - 4);
  }
  brush.noClip();
  // 砖内：冷灰 + 暖底
  hatchRect(bx, by, bw, bh, '#8C8B84', sw, period, -38, 3);
  hatchRect(bx + 2, by + 2, bw - 4, bh - 4, '#6E6D63', sw * 0.8, period * 1.7, -38, 1);
}

try {
  srnd(17);
  brush.createCanvas(N * COLS.length, N * PER.length);
  brush.angleMode(brush.DEGREES);
  brush.clear(PAPER);
  brush.translate(-N * COLS.length / 2, -N * PER.length / 2);
  COLS.forEach((sw, ci) => PER.forEach((pm, ri) => {
    brush.push();
    brush.translate(ci * N, ri * N);
    brush.seed(90 + ci * 10 + ri);
    brush.noiseSeed(70 + ci * 10 + ri);
    cell(0, 0, sw, sw * 0.33 * pm);
    brush.pop();
  }));
  brush.render();
  window.__ok = true;
} catch (e) { window.__err = String(e && e.stack || e); console.error(e); }
</script>
