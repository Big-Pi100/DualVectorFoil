<!doctype html>
<meta charset="utf-8">
<body style="margin:0">
<script type="module">
import * as brush from '../../../.deps/p5.brush/dist/brush.esm.js';
/* 瓦片正式生成器：墙 / 地。
 *
 * ## 为什么石头是 96×96（而不是最初设计的 96×48 小砖）
 *
 * 这是六个变体实验得出的唯一硬结论（见 P5BRUSH §7）：
 * `mass` 的弧线半径 = 形状的半对角线（源码 hatch/mass.js:360，
 * `radius = dist(center, part.x1, part.y1)`），**跟画布尺寸无关，
 * `scaleBrushes()` 也管不到它**（只改 weight/scatter/spacing）。
 * 所以 96×48 的砖里，一道弧线就比砖还宽，只能落下两三道，读成"毛刷扫过"。
 *
 * 要么小砖不用 mass（改用碎笔 → 被纸白框成贴纸，见 _exp_K），
 * 要么把石头做大，让弧线有地方施展（_exp_L）。
 * 后者对 —— 抱石墙本来就是地牢/钟塔的合理形制，而且它解决了一个
 * 更根本的问题：**背景元素要按"笔触能不能画得开"来定尺寸**，
 * 不是先定尺寸再找笔。
 *
 * ## 无缝的三条前提（每条都踩过）
 *   1. 相位一致：跨边界的元素必须在 0 与 192 处对齐 → 石头宽高必须整除 192
 *   2. 笔画环绕：9 重放，且每次重放前 seed 与自研 PRNG 全部归零 → 9 份严格同像素
 *   3. 不透明纸底：不存 RGBA（针孔露引擎底色 = 整墙结霜）
 */
const q = new URLSearchParams(location.search);
const kind = q.get('kind') || 'wall';
/* 画布宽：平台 1 格（48），墙/地 4 格（192）。 */
const N = kind === 'slab' ? 48 : 192;
/* 地面瓦片只有 48 高（1 格）。地面在关卡里就是 1~2 格厚的实心带，
 * 用 192 见方的瓦片铺进去只会露出顶上一行，等于把 3/4 的画白画了。 */
const H = kind === 'floor' ? 48 : (kind === 'slab' ? 20 : 192);
const S = +(q.get('seed') || 0);
const COAT = q.get('coat') || 'Z';   // 涂法变体：Z 是定版（两层 mass + 三层叠加出深浅）

const P = { paper:'#E8DCBE', charcoal:'#2B2320', cold:'#8C8B84',
            umber:'#6B4B32', ochre:'#B98A2E', moss:'#4F6B3A',
            grey_blue:'#4C6E8C', deep_blue:'#1F2E5C' };

let s = 1;
const srnd = (k) => { s = (k >>> 0) || 1; };
const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };

/* ── 一块石头 ─────────────────────────────────────────────────────────
 * passes 决定整体深浅（同一支笔涂几遍），这是石墙唯一正确的"明暗语言"：
 * 换颜色会读成两种材料，涂几遍才是同一块石头的光影。
 * 缺角/崩边放在最后 —— 它是把"方正色块"打成"石头"的最后一刀。 */
/* ## 自定义笔刷
 *
 * 内置 crayon 的 opacity 是 159/255（单笔 62%），本身已是"叠了才实"。
 * `wax` 再降到 104/255（41%），为的是让**每一道笔触都读得出来**：
 * 41% 的单笔盖不住纸，两道重叠才到 65%，三道到 79% —— 深浅全靠重叠次数，
 * 这正是蜡笔的行为。内置笔刷一涂就实，才会"太满"。
 *
 * `seam` 是画缝用的：crayon/charcoal 的 scatter 是 1.9/1.5，
 * 笔尖会横向甩开 1.5 个笔宽 → 2px 的缝被甩成虚线（前几版实拍全是断缝）。
 * seam 把 scatter 压到 0.22，并把 opacity 提到 210，线才连得住。 */
/* ## 两处关键参数（2026-11-25 查源码后纠正）
 *
 * ① `weight: 1.0` —— `set(name, color, w)` 的 w 是**乘**在笔刷 weight 上的
 *    （`tipReach = State.stroke.weight * param.weight`，stroke.js:562）。
 *    内置 crayon 的 weight 是 0.33，所以 set(…, 6) 实际只有 2px ——
 *    前几版"笔触又细又碎"一半是这个原因（以为设了 6px，其实 2px）。
 *    设成 1.0 后，set 的数字就是像素直径。
 *
 * ② `scatter: 0.38` —— scatter 不是"颗粒"，是**每个 dot 的横向随机偏移**，
 *    单位是笔宽。内置 crayon 1.9 / pastel 5，会把 4px 的笔散成 ±4.6/±20px 的
 *    点云，读成"砂纸"而不是"一道"（前几版实拍）。seam 用 0.22 能画出连续缝，
 *    就是这个道理。蜡笔的手抖只需 1/3 个笔宽。 */
brush.add('wax', { weight: 1.0, scatter: 0.38, sharpness: 0.80, grain: 1.4,
                   opacity: 132, spacing: 0.06, pressure: [1.15, 0.85],
                   type: 'default', rotate: 'natural', noise: 0.5 });
/* wash：只用来"铺一层很淡的底"，让石头露出来的地方是浅灰而不是纯纸色。
 * ‼ 这一点是从参考图反推的：p6_crayon 的深蓝城堡是**先铺实底、再蹭亮暗笔触**，
 *   露出来的从来不是白纸。石墙如果直接"纸色底 + 灰笔"，露纸就是一排白条，
 *   读成"没画完"（前几版实拍全是这个毛病）。 */
brush.add('wash', { weight: 1.0, scatter: 0.30, sharpness: 0.55, grain: 0.6,
                    opacity: 118, spacing: 0.06, pressure: [1.05, 0.95],
                    type: 'default', rotate: 'natural', noise: 0.3 });
/* waxline：试过、**失败**，留在这里是为了不再重走。
 *（失败原因见文末：排线清晰了，但 1px 笔在 8-bit 累积下出"白刮痕"，且整体拉平。）
 *
 * 原设想：
 * ‼ mass 内部固定 `set(brush, color, 1)`（hatch/mass.js:572），所以它的排线
 *   笔宽恒为 1px。这**不是缺陷**：参考图 p6_crayon 的笔触在 1536 画布上是
 *   8~12px，按 8 倍缩到我们 192 的瓦片正好是 1~1.5px。
 *   真正的病灶是内置 crayon 的 **scatter 1.9** —— 它把 1px 的笔横向散成 2px 的雾，
 *   一排线就糊成"水波/木纹"。把 scatter 压到 0.12，排线就是一根根清晰的蜡笔线。 */
brush.add('waxline', { weight: 1.0, scatter: 0.45, sharpness: 0.80, grain: 1,
                       opacity: 105, spacing: 0.07, pressure: [1.10, 0.90],
                       type: 'default', rotate: 'natural', noise: 0.6 });
brush.add('seam', { weight: 0.30, scatter: 0.22, sharpness: 0.80, grain: 1.1,
                    opacity: 210, spacing: 0.04, pressure: [1.05, 0.95],
                    type: 'default', rotate: 'natural', noise: 0.35 });
/* stripe：画**斜向粗条带**用的笔（2026-11-25，照生图砖块 ref_gen 加的）。
 *
 * ‼ 为什么不能直接用 wax：wax 的 scatter 0.38 在 5px 笔上会横向甩开 ±1.9px，
 *   而我们条带之间的缝只有 2~4px —— 缝被甩过来的笔尖舔掉一半，条带就糊成一片。
 *   蜡笔在实心排线时手更稳（一笔就是一笔），只有端点才散。
 *   grain 1.5 保留蜡笔颗粒（那是"蜡"的来源），scatter 压到 0.24 保住缝。
 *   opacity 165（65%）: 一笔不到实底，同一条带蹭两遍才实 —— 深浅差就来自这里。 */
brush.add('stripe', { weight: 1.0, scatter: 0.28, sharpness: 0.76, grain: 1.5,
                      opacity: 165, spacing: 0.05, pressure: [1.10, 0.90],
                      type: 'default', rotate: 'natural', noise: 0.45 });

/* waxhand：**手涂用**的粗笔（2026-11-25 v4）。
 *
 * ‼ 与 stripe 的根本区别不是粗细，是 `spacing`。
 *   p5.brush 的一条 line() = 沿路径每隔 spacing 打一个笔尖图章。
 *   stripe 的 spacing 0.05 → 每 0.05px 打一个，等于**连续实心色带**，
 *   所以它画出来永远是"平滑的一片"，没有蜡笔的颗粒和露纸。
 *   蜡笔是稀疏图章叠出来的：spacing 取笔宽的 8~12%（10px 笔 → 0.8~1.2px），
 *   图章之间留缝，纸色才透得出来 —— 这才是"蜡"的质感来源。
 *   pressure 区间拉大（1.1 / 0.7）：p5 的压力是沿笔触的高斯鼓包，
 *   区间越大，起笔/收笔越细 —— 人手的起收笔就长这样。 */
brush.add('waxhand', { weight: 1.0, scatter: 0.18, sharpness: 0.62, grain: 1.6,
                       opacity: 218, spacing: 0.30, pressure: [1.10, 0.90],
                       type: 'default', rotate: 'natural', noise: 0.55 });

/* hair：**高频细斜纹**用的笔（2026-11-25 v5）。
 *
 * ‼ 这支笔是"96px 硬边界"被推翻后才有的。
 *   把生图砖块压到 96×48 再放回，蜡笔排线依然清楚（std 42）——
 *   说明 96px 装得下，之前画不出来是因为**频率**错了：
 *   我一直画周期 8~10px 的粗条（96px 砖上只有 3~4 条），那是木纹；
 *   生图的纹理周期压到 96px 只有 **2.7px**（670px 砖上约 35 条），
 *   线宽 1.5px、缝 1.2px。质感来自**条纹密度**，不是笔触粗细。
 *
 *   所以这支笔必须细、必须稳：scatter 0.10（细笔经不起 0.28 的横甩，
 *   会把 1.5px 的线散成雾）、sharpness 0.88 保住线形、opacity 215 让单线就够读。
 *   spacing 0.25：线本身要连续，颗粒交给 grain。 */
brush.add('hair', { weight: 1.0, scatter: 0.10, sharpness: 0.88, grain: 1.2,
                    opacity: 215, spacing: 0.25, pressure: [1.05, 0.95],
                    type: 'default', rotate: 'natural', noise: 0.40 });

/* 往暖棕方向偏：k=0 不变，k=1 加到最多。
 * ‼ 参考图的石材是**暖棕灰**，我们的 base 是中性灰（#A4A398）。
 *   直接 shade() 只会让灰更暗更冷，所以亮底和暗线都得单独做暖偏移。 */
function warmize(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const cl = v => Math.max(0, Math.min(255, Math.round(v)));
  return '#' + ((cl((n >> 16) + 26 * k) << 16) | (cl(((n >> 8) & 255) + 8 * k) << 8) |
                cl((n & 255) - 18 * k)).toString(16).padStart(6, '0');
}

/* 调亮/调暗一个 hex 色：amt 是 -255~255 的通道加法偏移。 */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const cl = v => Math.max(0, Math.min(255, v + amt));
  return '#' + ((cl(n >> 16) << 16) | (cl((n >> 8) & 255) << 8) | cl(n & 255))
    .toString(16).padStart(6, '0');
}

/* 手涂一块石头：一道一道短线，方向统一。
 * clip 到石头包围盒，超出的笔尾自动裁掉（p5.brush 的 clip 只吃矩形，
 * 石头本来就是近矩形，够用）。 */
function handCoat(x, y, w, h, base, n, ang, wmin = 3.0, wmax = 6.0, pen = 'wax',
                  lenMin = 22, lenMax = 52) {
  /* 抖动网格：把石头切成 cols×rows 个格子，每格落一笔，笔长跨 1.5~2 格。
   *
   * ‼ 不能用"按行平行扫"（上一版 L）—— 行距固定，石头四角永远涂不到，
   *   角落留一圈纸色，整块就读成"贴纸贴上去的"（跟 _exp_F 同一个病）。
   *   网格 + 超长笔，角落自然被相邻格的笔扫到。
   * ‼ 每笔角度再抖 ±0.12rad：完全平行就成了排线，不是涂抹。 */
  brush.clip([x + 0.5, y + 0.5, x + w - 0.5, y + h - 0.5]);
  const diag = Math.hypot(w, h);
  /* ‼ 这里曾经是 Math.max(2, …)：n=1 会被放大成 2×2 = **4 笔**，
   *   于是"24 笔"实际画了 96 笔，怎么调都是"涂满"（连踩三版才发现）。
   *   最小值必须是 1。 */
  const cols = Math.max(1, Math.round(Math.sqrt(n * w / h)));
  const rows = Math.max(1, Math.round(n / cols));
  const cw = w / cols, ch = h / rows;
  for (let gy = 0; gy < rows; gy++) {
    for (let gx = 0; gx < cols; gx++) {
      const px = x + (gx + 0.5) * cw + (rnd() - 0.5) * cw * 0.9;
      const py = y + (gy + 0.5) * ch + (rnd() - 0.5) * ch * 0.9;
      /* 笔长：18~46px。这是按参考图量的 —— 蜡笔一笔的行程大约是笔宽的
       * 5~15 倍，不是横跨整块石头。太长就成"斜纹布"（P 版实拍）。 */
      const a = ang + (rnd() - 0.5) * 0.90;
      const ux = Math.cos(a), uy = Math.sin(a);
      const len = lenMin + rnd() * (lenMax - lenMin);
      const s0 = -len * (0.20 + rnd() * 0.60);
      brush.set(pen, base, wmin + Math.pow(rnd(), 1.4) * (wmax - wmin));
      brush.line(px + ux * s0, py + uy * s0, px + ux * (s0 + len), py + uy * (s0 + len));
    }
  }
  brush.noClip();
}

function coatStone(pts, x, y, w, h, base) {
  /* ## 涂法变体（2026-11-25 定版实验）
   *
   * ‼ 先纠正一个长期误解：**`strength` 不是浓度，是三档层数开关**。
   *   源码 createMass 里它只出现在两处 —— `if (strength > 0.33)` 打第 2 层、
   *   `if (strength > 0.66)` 打第 3 层（hatch/mass.js:605,621）。
   *   每层排线间距 dist≈2px，所以"变深"= 加层，代价是纸色被吃光。
   *
   * 上一版每块石头平均叠了 4.5 层（0.52 + 34%×0.58 + 0.30 + 26%×0.72），
   * 实测 std 只有 22、纸色 0%；定版参考图 p6_crayon.png 同尺寸是 std 74、纸色 17%。
   * **这就是"涂得太满"的量化含义。** */
  if (COAT === 'A') {
    /* 对照：上一版。 */
    brush.mass('crayon', base, { strength: 0.52, precision: 0.76 });
    brush.polygon(pts); brush.noMass();
    if (rnd() < 0.34) {
      brush.mass('crayon', base, { strength: 0.58, precision: 0.78 });
      brush.polygon(pts); brush.noMass();
    }
    brush.mass('crayon', base, { strength: 0.30 + rnd() * 0.08, precision: 0.66 });
    brush.polygon(pts); brush.noMass();
    if (rnd() < 0.26) {
      brush.mass('crayon', base, { strength: 0.72, precision: 0.9 });
      brush.rect(x + 1.5, y + 1.5, w - 3, h - 3); brush.noMass();
    }
  } else if (COAT === 'B') {
    /* 单层：只打第 1 层 pass（strength ≤ 0.33），排线自己撑开纸色。
     * crayon 本身的 opacity 是 159/255 —— 单笔只有 62%，排线之间必然透纸。 */
    brush.mass('crayon', base, { strength: 0.30, precision: 0.70 });
    brush.polygon(pts); brush.noMass();
  } else if (COAT === 'C') {
    /* 一层 mass + 一层 scribble：mass 保证"这块是实的"，scribble 出斑驳。 */
    brush.mass('crayon', base, { strength: 0.30, precision: 0.70 });
    brush.polygon(pts); brush.noMass();
    brush.mass('crayon', base, { style:'scribble', strength: 0.55, length: 26, follow: 0.3 });
    brush.polygon(pts); brush.noMass();
  } else if (COAT === 'D') {
    /* 纯 scribble 两遍：短手绘笔触，色调全靠重叠量。 */
    brush.mass('crayon', base, { style:'scribble', strength: 0.62, length: 30, follow: 0.35 });
    brush.polygon(pts); brush.noMass();
    brush.mass('crayon', base, { style:'scribble', strength: 0.40, length: 18, follow: 0.1 });
    brush.polygon(pts); brush.noMass();
  } else if (COAT === 'DD') {
    /* ## 为什么必须用 line() 而不是 mass/scribble
     *
     * `createMass()` 里固定 `set(State.mass.brush, color, 1)`（hatch/mass.js:572），
     * 所以 mass 的排线笔宽 = 1 × 笔刷 weight = 0.33px —— **它就是用极细笔
     * 密集排线堆出来的色块**，天然是"柔和水波"，怎么调都画不出一道粗笔触。
     * scribble 同理（也走 set(...,1)）。
     *
     * 结论：瓦片要"看得见的一道一道"，必须 mass 铺底 + line() 画粗笔（走 stroke 路径，
     * 笔宽由 set 决定，是真的像素）。 */
    brush.mass('wax', base, { strength: 0.52, precision: 0.74 });
    brush.polygon(pts); brush.noMass();
    const ang = -0.50 + (rnd() - 0.5) * 0.20;
    for (let i = 0; i < 20; i++) {
      const short = rnd() < 0.5;
      handCoat(x, y, w, h, base, 1, ang + (rnd() - 0.5) * 0.55, 3.6, 6.6, 'wax',
               short ? 14 : 30, short ? 28 : 56);
    }
    if (rnd() < 0.30) {
      brush.mass('crayon', base, { strength: 0.46, precision: 0.76 });
      brush.polygon(pts); brush.noMass();
    }
  } else if (COAT === 'Z') {
    /* ## 定版（2026-11-25）
     *
     * 参考图的画法是「**实底 + 明暗笔触**」：深蓝城堡的底几乎铺满，
     * 上面压着清晰的亮蓝短笔。所以"不填满"指的是**笔触可辨、明暗有层次**，
     * 不是"留白露纸"。瓦片是背景、铺满整屏，露白会读成"墙上破了个洞"。
     *
     * 三层：
     *   ① 实底 —— wash 宽笔铺满，石头从纸色变成"一块料"
     *   ② 明暗笔 —— 亮一档 / 暗一档 / 主色三档短笔，笔笔可辨
     *   ③ 顶亮底暗 —— 给石头方向，否则整面墙读成一块大板
     */
    const ang = -0.50 + (rnd() - 0.5) * 0.16;
    /* ① 底色：mass 两层（strength 0.42 触发 2 层 pass）。
     *   ‼ 旧版 A 是"一密一稀 + 34% 补 + 26% 三遍"≈ 4.5 层，纸纹被彻底吃掉，
     *     std 只有 13（一片平灰）—— 那才是"太满"。
     *     降到 2.6 层，排线之间的纸还能透一点，笔触自己就出来了。 */
    brush.mass('crayon', base, { strength: 0.42, precision: 0.74 });
    brush.polygon(pts); brush.noMass();
    if (rnd() < 0.28) {
      brush.mass('crayon', base, { strength: 0.50, precision: 0.78 });
      brush.polygon(pts); brush.noMass();
    }
    /* ② 不用亮笔/暗笔点缀：试过三档明暗、亮笔压底、wash 铺底，
     *   在 96×48 的小砖上都会变成"贴了几道胶带 / 迷彩"——
     *   因为一块砖只有 4600 像素，任何一道 4px 的异色笔都占 1/10 面积。
     *   参考图那种亮笔触是服务 100px 以上的大形体的，瓦片尺度用不上。
     *   层次只能靠"叠几遍"来出：同一支笔 1 遍浅、2 遍中、3 遍深。 */
  } else if (COAT === 'S' || COAT === 'T' || COAT === 'U' || COAT === 'V') {
    /* ## 细密斜条带（2026-11-25 v2，照生图砖块 ref_gen 复现）
     *
     * 生图砖块读起来是"蜡笔"，靠的不是涂满，是**一条条看得见的斜笔**。
     * 但它有三条很容易抄错的细节（第一版 S 全踩了，渲染出"木地板"）：
     *
     * ① **带很细**：1024 图上带宽约 20px、砖宽 690px → 只占 3%。
     *    第一版按 3.4~7.2px 画（占砖宽 5~7%），粗了一倍，直接成条纹布。
     *    正确值：96px 砖上 2.2~3.6px。
     * ② **缝很窄且不亮**：缝只占 1.5~2px，而且缝里是"浅灰"不是"纯纸"。
     *    第一版缝 1.7~4.5px 还透纯纸色 → 对比过大，读成"地板缝"。
     * ③ **条带不长通长**：三成条带只走半程，端点错落；再撒十几笔短笔打散。
     *    全部通长 + 同一起止，就是"印上去的条纹"（P 版老病）。
     *
     * ‼ 角度：生图砖是方形（690×595）所以 -35° 好看；我们的砖是 2:1 横条，
     *   同样的角度会显得"太斜"、读成斜纹布。参考图 p6_crayon 的台阶石
     *   （同样是横长条石材）条纹是**接近水平**的 —— 这里取 -17° 左右。
     */
    /* ## 角度与带宽（2026-11-25 v3）
     *
     * ‼ 横长条石材的条纹**接近水平**，不是 30°。
     *   定版图 p6_crayon 的台阶石（同样是 2:1 横长条）条纹只斜 3~6° ——
     *   顺长边涂是最省力的手部动作，人也这么画。
     *   前几版照生图的方形砖取 -17°/-30°，在 2:1 的砖上读成"斜纹布"。
     *   V 变体保留斜档做对照，其余走水平。
     *
     * ‼ 带宽也要按参考图量：台阶石一层约占石高的 1/5（48px 砖上 8~10px）。
     *   前几版 2.2~3.6px 只有 1/15，太碎，读成"纹理"而不是"笔触"。 */
    const horiz = COAT !== 'V';
    const a = (horiz ? -0.07 : -0.34) + (rnd() - 0.5) * (horiz ? 0.14 : 0.24);
    const ux = Math.cos(a), uy = Math.sin(a);    // 带方向
    const nx = -uy, ny = ux;                     // 法线：沿它排带
    const cx = x + w / 2, cy = y + h / 2;
    let mn = 1e9, mx = -1e9;
    for (const [px, py] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]]) {
      const t = (px - cx) * nx + (py - cy) * ny;
      if (t < mn) mn = t;
      if (t > mx) mx = t;
    }
    /* 淡底：T 先垫一层很薄的 crayon。
     * ‼ 目的不是"涂满"，而是把缝填成**浅灰**。参考图里蜡笔来回蹭过的地方
     *   从来不是白纸 —— 缝里透纯纸色的墙，铺满一屏就读成"破了很多洞"。 */
    if (COAT === 'T') {
      brush.mass('crayon', base, { strength: 0.30, precision: 0.56 });
      brush.polygon(pts); brush.noMass();
    }
    brush.clip([x + 0.5, y + 0.5, x + w - 0.5, y + h - 0.5]);
    const L = Math.hypot(w, h);
    /* 法线区间外多铺 3px：条带顶到砖角，否则四角留一圈纸色
     * （"贴纸贴上去"的老毛病，见 handCoat 顶部注释）。 */
    let t = mn - 3;
    while (t < mx + 3) {
      /* U 变体：细带 + 宽缝（露更多底色，对照"要不要透"）。 */
      const bw = COAT === 'U' ? (3.0 + Math.pow(rnd(), 1.3) * 2.2)
                              : (4.8 + Math.pow(rnd(), 1.3) * 3.4);
      const gp = COAT === 'U' ? (2.6 + rnd() * 1.8)
                              : (1.7 + rnd() * 1.1);
      /* ## 明暗必须来自"条带在哪"，不是"另叠一层亮笔"
       *
       * 这是本次最关键的一条。前几版条带之间只有 ±12 的色差，
       * 量化出来 std 17~19，而参考图同一口径是 59 —— 差三倍。
       * 差在哪：参考图一块石头的**上沿条带是浅的、下沿是深的**，
       * 整块石头就是从亮到暗的渐变；我们画的是"均匀中灰 + 微微抖动"。
       *
       * ‼ 而且 `stripe` 的 opacity 只有 165/255（65%），笔色会被纸色抬亮：
       *   合成后 = 0.647×笔色 + 0.353×纸(≈220)。所以想让砖面读到 90，
       *   笔色得压到 20 左右 —— 按"看起来的亮度"设偏移，永远对比不足
       *   （前几版 grad 只给 ±25，合成后差距只剩十几，全糊在一起了）。
       *   这里按合成公式反推：顶部 pen≈base、底部 pen 直接压到很暗。
       */
      const rel = Math.min(1, Math.max(0, (t - mn) / Math.max(1, mx - mn)));
      const grad = 48 - 104 * rel;                   // 顶亮、底压暗（整体位置已按实测校准）
      const q = rnd();
      const col = shade(base, grad + (q - 0.5) * 20);
      const off = (rnd() - 0.5) * 0.8;   // 条带位置轻抖：缝宽才不均匀
      /* 三成条带只走 50~75% 长度，起点随机 → 端点错落，不成"通长条纹"。 */
      const part = rnd() < 0.30;
      const lf = part ? (0.50 + rnd() * 0.25) : 1.0;
      const s0 = part ? -(1 - lf) * L * rnd() : 0;
      brush.set('stripe', col, bw);
      /* ## 条带必须"断成几段"，不能一笔拉通
       *
       * 一笔拉通的条带（上一版）读成"机织斜纹"——因为蜡笔做不到 96px 不断。
       * 参考图放大看，每条"带"其实由 2~4 段短笔接起来，段间有 1~3px 缺口，
       * 段尾还翘一点。这样条带的整体方向还在，但"印上去"的整齐感没了。
       *
       * 段长度不是均分：每段 60%~110% 的均分长度 → 缺口宽度自然不均。 */
      const segs = 2 + Math.floor(rnd() * 3);
      const segBase = (2 * L) / segs;
      let pos = -(L - s0) + (rnd() - 0.5) * 4;
      for (let si = 0; si < segs; si++) {
        const segLen = segBase * (0.60 + rnd() * 0.50);
        /* 段尾角度翘 ±3°：手画长笔的收笔会偏，全平行就没有这个细节。 */
        const a2 = a + (rnd() - 0.5) * 0.10;
        const vx = Math.cos(a2), vy = Math.sin(a2);
        brush.line(cx + nx * (t + off) + ux * pos,
                   cy + ny * (t + off) + uy * pos,
                   cx + nx * (t + off) + vx * (pos + segLen),
                   cy + ny * (t + off) + vy * (pos + segLen));
        pos += segLen + 1.0 + rnd() * 2.4;   // 缺口 1~3.4px
      }
      t += bw + gp;
    }
    /* 短笔打散：十几笔 10~24px 的同向短蹭。
     * 只靠通长条带，砖面会读成"整齐的机织纹"；短笔是"手在局部来回蹭"的痕迹，
     * 也是参考图里条带边缘毛糙的原因。短笔跟着同一套明暗走（位置越高越亮）。 */
    const nb = COAT === 'U' ? 14 : 10;
    for (let i = 0; i < nb; i++) {
      const px = x + rnd() * w, py = y + rnd() * h;
      const aa = a + (rnd() - 0.5) * 0.55;
      const ln = 10 + rnd() * 14;
      const rg = (py - y) / h;
      brush.set('stripe', shade(base, 48 - 104 * rg + (rnd() - 0.5) * 22), 1.8 + rnd() * 1.6);
      brush.line(px, py, px + Math.cos(aa) * ln, py + Math.sin(aa) * ln);
    }
    /* 顶亮底暗：给石头方向感。窄一点，别压过条带。 */
    brush.set('stripe', shade(base, 34), 1.6);
    brush.line(x + 1, y + 1.2, x + w - 1, y + 1.2);
    brush.set('stripe', shade(base, -36), 1.8);
    brush.line(x + 1, y + h - 1.2, x + w - 1, y + h - 1.2);
    brush.noClip();
  } else if (COAT === 'W' || COAT === 'Y') {
    /* ## 手涂 v4（2026-11-25）：按"人拿蜡笔涂一块石头"的动作画
     *
     * ‼ 前面 S/T/U/V 全错在一个地方 —— **不是参数，是动作**。
     *   我用「法线排布 + 精确间距 t += bw+gp」画了一串平行直线：
     *   每一笔的位置、方向、粗细、间距都是算出来的。
     *   那是**机器铺排**，所以怎么调都像机织纹理 / 横纹壁纸。
     *
     * 人涂一块 96×48 的石头其实只有 8~11 个动作：
     *   ① 同一支笔（粗细基本不变），横着蹭
     *   ② 每笔从砖外起手、砖外收手 —— clip 裁掉后边缘天然不齐
     *   ③ 方向随手偏 ±6°，会压到上一笔上（不是并列）
     *   ④ 笔压是起轻、中间重、收笔翘（p5 的压力本来就是高斯鼓包）
     *
     * ‼ 所以这里**不做任何排布**：层位、方向、长度、起手点全随机，
     *   只保证"大致横着、大致从上到下铺到"。冲突和重叠才是手绘的证据。
     */
    const wide = COAT === 'Y';
    const nb = (wide ? 6 : 8) + Math.floor(rnd() * 4);
    const ang0 = -0.07 + (rnd() - 0.5) * 0.18;
    brush.clip([x + 0.5, y + 0.5, x + w - 0.5, y + h - 0.5]);
    for (let i = 0; i < nb; i++) {
      /* 层位：按 i 大致分层，但抖动放到 ±75% 层高 —— 抖动小就又成排线了。 */
      const ly = y + (i + 0.5) * h / nb + (rnd() - 0.5) * (h / nb) * 1.5;
      const rel = Math.min(1, Math.max(0, (ly - y) / h));
      const ang = ang0 + (rnd() - 0.5) * 0.22;
      const len = w * (0.85 + rnd() * 0.80);
      const x0 = x - 10 - rnd() * 16;                    // 从砖外起手
      const bw = (wide ? 12 : 9) + rnd() * 4;
      brush.set('waxhand', shade(base, 48 - 104 * rel + (rnd() - 0.5) * 18), bw);
      brush.line(x0, ly, x0 + Math.cos(ang) * len, ly + Math.sin(ang) * len);
    }
    /* 来回蹭：两三笔压在中间偏下，制造局部深斑（人涂到暗处会反复蹭）。 */
    const nc = 2 + Math.floor(rnd() * 2);
    for (let i = 0; i < nc; i++) {
      const ly = y + h * (0.42 + rnd() * 0.52);
      const ang = ang0 + (rnd() - 0.5) * 0.30;
      const x0 = x + rnd() * w * 0.45;
      brush.set('waxhand', shade(base, -26 + (rnd() - 0.5) * 22), 7 + rnd() * 4);
      brush.line(x0, ly, x0 + Math.cos(ang) * w * 0.55, ly + Math.sin(ang) * w * 0.55);
    }
    brush.noClip();
  } else if (COAT === 'P' || COAT === 'Q' || COAT === 'R') {
    /* ## 细笔多次涂抹（2026-11-25 v6）
     *
     * 用户判据：「手绘蜡笔是细笔触多次涂抹」。
     *
     * W/Y 的错不在"手涂"这个动作，在**笔太宽**：9~16px 一笔盖住砖面的 1/5，
     * 一块砖只有 8~11 笔 → 观感是"几条宽带"，不是"涂过的面"。
     *
     * 真实蜡笔是 1~2px 的笔尖，在同一块面上**来回蹭几十次**。
     * 深浅不来自"某笔涂得多深"，来自**这个位置被蹭到几次**：
     *   蹭三次的地方深一层，蹭一次的地方浅，一次没蹭到的透底色。
     * 所以正确的做法不是"一遍排满细线"（N 版），而是
     *   **每遍只画一半、相位错开、叠 6~14 遍** —— 深浅自己会长出来。
     *
     * ‼ 每遍方向只偏 ±4°（0.14rad）。人手在同一块面上不会每遍换方向，
     *   但也不会完全一致；偏太多会揉成一团乱麻，反而失去石材的纹向。
     */
    const passes = COAT === 'P' ? 6 : (COAT === 'Q' ? 10 : 14);
    const cover = COAT === 'P' ? 0.55 : (COAT === 'Q' ? 0.45 : 0.35);
    /* 亮底：只垫一层很淡的 crayon，把纸色从"死白"拉到"浅米"。
     * 不垫的话，14 遍稀疏细线之间会露出成片纯纸色 → 读成"破洞"。 */
    brush.mass('crayon', shade(base, 56), { strength: 0.28, precision: 0.52 });
    brush.polygon(pts); brush.noMass();

    const a0 = -0.50 + (rnd() - 0.5) * 0.80;
    brush.clip([x + 0.5, y + 0.5, x + w - 0.5, y + h - 0.5]);
    const cx = x + w / 2, cy = y + h / 2;

    for (let p = 0; p < passes; p++) {
      const a = a0 + (rnd() - 0.5) * 0.14;
      const ux = Math.cos(a), uy = Math.sin(a);
      const nx = -uy, ny = ux;
      let mn = 1e9, mx = -1e9;
      for (const [px, py] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]]) {
        const t = (px - cx) * nx + (py - cy) * ny;
        if (t < mn) mn = t;
        if (t > mx) mx = t;
      }
      const L = Math.hypot(w, h);
      /* 每遍起始相位不同 —— 这是"斑驳"的唯一来源。
       * 相位相同的话，即使只画一半，各遍也会落在同样的位置上，又变回排线。 */
      let t = mn - 1 + rnd() * 3;
      while (t < mx + 1) {
        if (rnd() < cover) {
          const rel = Math.min(1, Math.max(0, (t - mn) / Math.max(1, mx - mn)));
          /* 上亮下暗 + 每笔 ±16 抖。抖幅比条纹版（±9）大一半：
           * 手蹭的深度本来就不均匀，太小就又成"均匀条纹"了。 */
          const col = shade(base, 26 - 72 * rel + (rnd() - 0.5) * 32);
          brush.set('hair', col, 1.0 + rnd() * 0.9);
          /* 起手在砖外（u 为负）、长度 50~110% 对角线：
           * 有的笔从外面进来，有的到中途就收 —— 收笔位置不一才不像排线。 */
          const uS = -L * 0.5 - rnd() * L * 0.35;
          const uE = uS + L * (0.50 + rnd() * 0.60);
          brush.line(cx + nx * t + ux * uS, cy + ny * t + uy * uS,
                     cx + nx * t + ux * uE, cy + ny * t + uy * uE);
        }
        t += 2.2 + rnd() * 2.0;
      }
    }
    brush.noClip();
  } else if (COAT === 'FA' || COAT === 'FB') {
    /* ## 细笔短蹭（2026-11-25 v7）—— 真正对上"人怎么用蜡笔"
     *
     * P/Q 已经做到"细笔 + 多遍"，但看图还是斜纹布。
     * 差在哪：P/Q 的每一笔仍然是**贯穿整块砖的长线**（0.5~1.1 倍对角线）。
     * 人拿蜡笔涂一块 96×48 的石头，一笔只有 **8~18px** ——
     * 是短促的来回蹭，不是一条拉到底的线。
     *
     * 所以这一版换掉整个动作结构：
     *   不做排布、不做遍次，直接**撒 n 笔**：
     *   每笔的落点随机撒在砖面（含砖外扩一圈）、方向在同一主向上 ±20°、
     *   长度 6~18px、宽 1.0~1.8px。
     * 深浅完全来自"这个位置被几笔盖到" —— 中心密、边角疏，
     * 自然的明暗起伏，不需要再用 grad 去算。
     *
     * ‼ 方向必须有个主向（a0），不能全随机：
     *   全随机撒会变成"毛毡/乱麻"，石材的纹向就没了。
     *   参考图能读出斜向，靠的就是"大部分笔朝同一个方向"。
     */
    const n = COAT === 'FA' ? 90 : 150;
    /* 亮底：这一层把纸色从"死白"拉到"浅米"。
     * ‼ 不能省。只靠短笔盖不满，14px 短笔之间必有缝，
     *   缝里是纯纸白就会读成"砂纸/破洞"（P 版就是这样）。 */
    brush.mass('crayon', shade(base, 46), { strength: 0.42, precision: 0.52 });
    brush.polygon(pts); brush.noMass();

    const a0 = -0.50 + (rnd() - 0.5) * 0.80;
    brush.clip([x + 0.5, y + 0.5, x + w - 0.5, y + h - 0.5]);
    for (let i = 0; i < n; i++) {
      /* 落点：x 放宽到 [-8%, 108%]，让一部分笔从砖外压进来（手不停在边内）。 */
      const px = x + (-0.08 + rnd() * 1.16) * w;
      const py = y + (-0.08 + rnd() * 1.16) * h;
      const rel = Math.min(1, Math.max(0, (py - y) / h));
      /* 主向 ±20°；另有一成笔偏到 ±45°，做交叉。 */
      const wide = rnd() < 0.10;
      const a = a0 + (rnd() - 0.5) * (wide ? 1.6 : 0.70);
      const ln = 6 + rnd() * 12;
      /* 上亮下暗 + 每笔抖 ±20：手蹭的深度本来就不匀。 */
      const col = shade(base, 22 - 66 * rel + (rnd() - 0.5) * 40);
      brush.set('hair', col, 1.0 + rnd() * 0.8);
      brush.line(px, py, px + Math.cos(a) * ln, py + Math.sin(a) * ln);
    }
    brush.noClip();
  } else if (COAT === 'FC' || COAT === 'FD') {
    /* ## 短段密排（2026-11-25 v8）—— 目标砖的真实结构
     *
     * 对着 `_exp/cmp_FA.png` 第①块（生图压到 96×48）逐条数出来的：
     *   · 每条线 **10~20px 长**（不是通长），端点参差不齐
     *   · 线与线间距只有 **1.5~2.5px**，密到几乎挨着
     *   · 方向一致（约 -30°），但因为每条都短，读不出"一条拉到底"
     *   · 底是暖米（143），线是深棕（100 左右），对比约 43
     *
     * 所以 FA（撒 90 笔短杠）错在**太稀**：落点随机撒，间距变成 8~12px，
     * 读成"砂纸/雀斑"。P 错在**太长**：间距对了但线通长 → 斜纹布。
     *
     * 正解是两者的交集：**按法线密排（间距 1.5~2.5px），但每条只画 10~22px，
     * 起点随机错位，再叠 3~4 遍**。密排保证盖住，短段保证不读出通长线。
     */
    const passes = COAT === 'FC' ? 3 : 4;
    /* 亮底：目标砖的底（143）比我们的 base（~160）暗，
     * 用 shade(base,26) 刚好；FA 用 46 就偏白了。 */
    brush.mass('crayon', warmize(shade(base, 26), 0.40), { strength: 0.46, precision: 0.52 });
    brush.polygon(pts); brush.noMass();

    const a0 = -0.50 + (rnd() - 0.5) * 0.80;
    brush.clip([x + 0.5, y + 0.5, x + w - 0.5, y + h - 0.5]);
    const cx = x + w / 2, cy = y + h / 2;
    const L = Math.hypot(w, h);

    for (let p = 0; p < passes; p++) {
      const a = a0 + (rnd() - 0.5) * 0.12;
      const ux = Math.cos(a), uy = Math.sin(a);
      const nx = -uy, ny = ux;
      let mn = 1e9, mx = -1e9;
      for (const [px, py] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]]) {
        const t = (px - cx) * nx + (py - cy) * ny;
        if (t < mn) mn = t;
        if (t > mx) mx = t;
      }
      let t = mn - 1 + rnd() * 2.2;

        const u0 = (rnd() - 0.5) * (L * 0.9);

     * 对着目标砖放大看，它的结构是：
     *   · 一条条**连续的斜线**（不是碎短杠），方向基本一致
     *   · 但线之间**不平行**：有交叉、有压叠，形成细密的网状微结构

     *   这才是蜡笔在一个面上来回蹭的样子。

     * ‼ 与 N 版（一遍排满）的唯一区别就是"遍数 + 每遍角度偏移"。
     *   N 版 35 条完全平行 → 斜纹布；这里 5 遍 × 各 25 条交错 → 手涂。

    brush.polygon(pts); brush.noMass();

    brush.clip([x + 0.5, y + 0.5, x + w - 0.5, y + h - 0.5]);
    const cx = x + w / 2, cy = y + h / 2;
    const L = Math.hypot(w, h);

    for (let p = 0; p < passes; p++) {
      /* 每遍角度：以 a0 为中心均匀铺开（-20° ~ +20°），再加手抖。
       * 均匀铺开而不是随机，是为了保证"一定存在交叉" ——
       * 全随机可能 5 遍都撞在同一角度，就退化成 N 版。 */
      const a = a0 + (p / (passes - 1) - 0.5) * 0.70 + (rnd() - 0.5) * 0.10;

    brush.mass('crayon', warmize(shade(base, 40), 0.55), { strength: 0.50, precision: 0.50 });

      const u0 = -L * 0.75 + rnd() * L * 0.45;

     * 把生图砖块直接压到 96×48 再放回，**蜡笔排线依然清清楚楚**（std 42）。
     * 也就是说 96px 的砖装得下这个质感 ——

     * 画不出来不是面积不够，是**频率**选错了。

     *   生图砖 670px 宽、约 35 条线 → 周期 19px。
     *   压到 96px 宽 → **周期 2.7px**、线宽 1.5px、缝 1.2px。
     *   我一直画的是周期 8~10px 的粗条（只有 3~4 条）——
     *   那个频率就是"木纹/壁纸"的频率，怎么调色都不像蜡笔。

     * ⇒ 质感来自**条纹密度**，不是笔触粗细。这是本轮唯一真正的答案。
     */
    const per0 = COAT === 'N' ? 3.25 : 3.8;          // 周期（px）

     * 生图砖块正相反：**底是暖米色（亮），线是深棕（暗）**。
     * 这就是"蜡笔涂在纸上"的基本关系 —— 蜡笔只会把纸**压暗**，
     * 不可能画出一条比纸还亮的线（除非叠了白蜡）。
     * 所以顺序必须是：先铺亮底，再把暗线压上去。
     * ‼ 底不能靠"少画几条线露出纸色"来做亮 —— 那会露成白条；

    if (COAT === 'N') {

    const nx = -uy, ny = ux;
    const cx = x + w / 2, cy = y + h / 2;
    let mn = 1e9, mx = -1e9;
    for (const [px, py] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]]) {

      const col = warmize(shade(base, (COAT === 'N' ? -4 : 30) - 74 * rel + (rnd() - 0.5) * 18), COAT === 'N' ? 0.22 : 0);

      if (rnd() < 0.92) {

        brush.line(cx + nx * (t + off) - ux * L, cy + ny * (t + off) - uy * L,
                   cx + nx * (t + off) + ux * (cut - wd), cy + ny * (t + off) + uy * (cut - wd));
        brush.line(cx + nx * (t + off) + ux * (cut + wd), cy + ny * (t + off) + uy * (cut + wd),
                   cx + nx * (t + off) + ux * L, cy + ny * (t + off) + uy * L);
      }
      t += per;

     * 没有这一层，35 条平行线还是"机织"；有了它才是"手拿蜡笔来回撇"。 */
    for (let i = 0; i < 2; i++) {
      const tt = mn + rnd() * (mx - mn);
      const aa = a + (rnd() < 0.5 ? -1 : 1) * (0.25 + rnd() * 0.35);
      brush.set('hair', shade(base, (rnd() - 0.6) * 30), 1.2 + rnd() * 1.0);
      brush.line(cx + nx * tt - Math.cos(aa) * L * 0.6, cy + ny * tt - Math.sin(aa) * L * 0.6,
                 cx + nx * tt + Math.cos(aa) * L * 0.6, cy + ny * tt + Math.sin(aa) * L * 0.6);

  } else if (COAT === 'X') {

    for (let i = 0; i < 34; i++) {

     * 这是"人拿蜡笔涂一块石头"的真实动作，也直接对应参考图的质感：
     * 笔触长度 30~70px、方向一致、重叠处深、单道处浅。
     * ‼ 一密一稀的 mass 之所以"太满"，是因为它按 2px 间距铺满不留缝；
     *   手涂的行距是 5~8px，中间必然留浅色。 */
    const rows = COAT === 'H' ? 14 : (COAT === 'J' ? 22 : (COAT === 'K' ? 10 : 20));
    if (COAT === 'J') {   // 先垫一层极薄的 mass 兜底，避免直接露大片纸
      brush.mass('crayon', base, { strength: 0.30, precision: 0.62 });
      brush.polygon(pts); brush.noMass();
    }
    const ang = -0.52 + (rnd() - 0.5) * 0.18;   // 全图统一约 -30°
    if (COAT === 'L' || COAT === 'M') {
      /* 第三轮：H 的露纸率对了（18%），但读成"没画完"。
       * 加行数 + 加笔宽把覆盖率抬到七成左右，剩下三成才是真正的蜡笔留白。
       * 另加个体差异：四成石头再补一遍，方向偏 30°，重叠处变深。 */
      handCoat(x, y, w, h, base, 18, ang);
      if (COAT === 'M') handCoat(x, y, w, h, base, 8, ang + 0.55);
    } else {
      handCoat(x, y, w, h, base, rows, ang);
    }
  } else if (COAT === 'E' || COAT === 'F' || COAT === 'G') {
    /* 第二轮：D 的质感对了，但每块石头一样深、笔触方向每块都不同。
     * 修法：① 先垫一层 mass 定方向与整体色调（可选）
     *       ② 两层 scribble，一长一短，长的给"蹭"，短的给颗粒
     *       ③ 三分之一石头多蹭一层 → 个体差异
     * ‼ scribble 的 baseAngle 是 mass 内部 rr2(-90,90) 随机的，外部传不进去 ——
     *   所以"方向一致"只能靠垫一层 mass（它至少给一个主方向）。 */
    if (COAT === 'F') {
      brush.mass('crayon', base, { strength: 0.30, precision: 0.70 });
      brush.polygon(pts); brush.noMass();
    }
    const L1 = COAT === 'G' ? 45 : 34;
    const fol = COAT === 'G' ? 0.20 : 0.0;
    brush.mass('crayon', base, { style:'scribble', strength: 0.58, length: L1, follow: fol });
    brush.polygon(pts); brush.noMass();
    brush.mass('crayon', base, { style:'scribble', strength: 0.34, length: 20, follow: 0.0 });
    brush.polygon(pts); brush.noMass();
    if (rnd() < 0.34) {
      brush.mass('crayon', base, { style:'scribble', strength: 0.52, length: 26, follow: 0.0 });
      brush.polygon(pts); brush.noMass();
    }
  }
}

function stone(x, y, w, h, base) {
  /* 缝宽：每块石头内缩量略有不同，缝就不是等宽的一条条。
   * 等宽缝是"贴图"的最大破绽 —— 真砌石没有两块缝一样宽。 */
  const pad = 0.9 + rnd() * 0.6;
  /* 石头是**四边形，不是矩形**。四个角各抖 ±2px，缝宽就自然不均匀了。
   * 抖动值必须来自 srnd（9 重放一致），用 Math.random 会让 9 份错开、接缝裂开。 */
  const jx = () => (rnd() - 0.5) * 2.2, jy = () => (rnd() - 0.5) * 2.2;
  const pts = [
    [x + pad + jx(),     y + pad + jy()],
    [x + w - pad + jx(), y + pad + jy()],
    [x + w - pad + jx(), y + h - pad + jy()],
    [x + pad + jx(),     y + h - pad + jy()],
  ];
  coatStone(pts, x, y, w, h, base);

  /* 短蹭痕：石头表面的"笔一道笔一道"全靠这个。
   * mass 的笔触是绕形状中心的长弧，单独用就像水波纹；
   * 叠几道 15~40px 的短直线，才读成"来回蹭过的石头"。
   * crayon 每笔只有 62% 不透明度 → 短笔之间自然留出浅色，这是露纸的第二个来源。 */
  /* 手涂变体的笔触本身就是"短蹭痕"，再叠一遍只会更满 —— 只留两三道补漏。 */
  const hand = COAT === 'H' || COAT === 'J' || COAT === 'K' ||
               COAT === 'L' || COAT === 'M';
  const n = hand ? 2 + Math.floor(rnd() * 2)
                 : (COAT === 'A' ? 3 + Math.floor(rnd() * 3) : 5 + Math.floor(rnd() * 4));
  for (let i = 0; i < n; i++) {
    const yy = y + 6 + rnd() * (h - 12);
    const x0 = x + 4 + rnd() * (w * 0.55);
    brush.set('crayon', base, 1.5 + rnd() * 1.3);
    brush.line(x0, yy, x0 + 12 + rnd() * (w * 0.32), yy + (rnd() - 0.5) * 12);
  }
  /* 崩边：不是画个三角，是让那块地方的笔触"塌下去"。 */
  if (rnd() < 0.30) {
    const cx = rnd() < 0.5 ? x + 4 : x + w - 4;
    const cy = rnd() < 0.5 ? y + 4 : y + h - 4;
    brush.set('crayon', P.charcoal, 2.2 + rnd() * 1.6);
    brush.line(cx, cy, cx + (cx < x + w / 2 ? 1 : -1) * (8 + rnd() * 14),
               cy + (cy < y + h / 2 ? 1 : -1) * (5 + rnd() * 9));
  }
}

function paint() {
  srnd(S * 7919 + 131);

  /* 底：浅一档的排线，只为"缝里不是纯纸色"。
   * ‼ 不要用深底当缝：石头是 mass 涂的，它在 rect 边缘会把笔触堆起来，
   *   形成一圈比内部更亮的边 —— 正好就是"贴纸描边"的效果（上一版实拍）。
   *   缝必须是**画上去的暗线**，不是露出来的底。 */
  /* 不铺满底。蜡笔的质感一半来自"纸色从笔缝里透出来"，
   * 铺一层密排线会把纸吃干净，整面墙变成"刷涂料"。
   * 缝是深色线画上去的，所以不需要底色来兜结构。 */

  if (kind === 'slab') {
    /* 平台石板：48×20，一格一块。
     * 顶面那条赭金是"能踩"的信号 —— 游戏里玩家靠它判断落点，
     * 所以它必须是瓦片的一部分，不能交给程序后画（一压就没了）。
     * 石块本身用 hatch 铺，不用 mass：20px 高画不下弧线，只会糊成一条。 */
    brush.noStroke();
    /* 两遍：20px 高只画得下十几道排线，一遍会露出大片纸色，
     * 平台就成了"白色薄片"（实拍）。 */
    brush.hatchStyle('crayon', P.cold, 1.15);
    brush.hatch(3.0, (rnd() - 0.5) * 6, { rand: 0.4 });
    brush.rect(1, 4, N - 2, 13);
    brush.hatch(3.4, 2, { rand: 0.4 });
    brush.rect(1, 4, N - 2, 13);
    brush.noHatch();
    /* 石块之间的接缝：一格一块，靠左右两条暗边读出来 */
    brush.set('charcoal', P.charcoal, 1.6);
    brush.wiggle(0.15);
    brush.line(0.8, 4, 0.8, 17);
    brush.line(N - 0.8, 4, N - 0.8, 17);
    brush.noField();
    /* 顶面：赭金亮线 + 一道更亮的细线，受光面 */
    brush.set('crayon', P.ochre, 2.4);
    brush.line(0, 4.6, N, 4.6);
    /* 只留一条赭金。曾经叠一条更亮的 2B 细线，两条一起出来是"荧光条"，
     * 平台比角色还抢眼 —— 能踩的信号要清楚，但不能发光。 */
    brush.set('crayon', P.umber, 1.2);
    brush.line(0, 3.4, N, 3.4);
    /* 底边：投到空气里的暗，给厚度 */
    brush.set('charcoal', P.charcoal, 1.6);
    brush.line(0, 16.6, N, 16.6);
    /* 两颗铆钉 */
    brush.set('crayon', P.charcoal, 1.6);
    brush.line(11, 11, 13.5, 11);
    brush.line(N - 13.5, 11, N - 11, 11);
  } else if (kind === 'wall') {
    /* 抱石墙：96×96，两行，第二行错半块。
     * 只 4 块石头 → 单张瓦片的重复感靠"6 个变体 + 四向翻转"在游戏里打散。 */
    /* 4 行 × 96×48 小砖，隔行错半块。
     * ‼ 中途试过"抱石墙"（96×96 大石），单看好看，进游戏整面墙读成"预制板"——
     *   石块占 96px 屏幕，10 块就铺满一屏，既不像砖墙也压不住前景。
     *   而且用户说的"墙丑"指的是**画法**（几何直线 + 噪点滤镜），不是砖太大。 */
    if (COAT === 'GG') {
      /* ## 整面细笔多遍（2026-11-25 v11）—— 结构对了，笔触换成细的
       *
       * 用户判据：「手绘蜡笔是细笔触多次涂抹」。
       * 前面 FG 已经把**单块砖**做到量化吻合（线宽 1.4px / 间距 4.3px /
       * RGB 150,141,119 vs 目标 156,142,120），但**铺满一屏就成了斜纹布**。
       *
       * 根因是结构不是参数：FG 在 `stone()` 里逐块涂，
       * 每块砖都独立"斜涂一遍" → 8 块砖就是 8 块斜纹板，人脸看了就是补丁。
       * 真实的手绘墙只涂**一遍**，笔触从这块砖划到那块砖，
       * 砖缝是涂完之后再用暗线勾出来的结构。
       *
       * 所以这里沿用 EE 的整面结构（`mass` 铺底 + 跨砖笔触 + 后勾缝），
       * 只把 EE 的**粗笔长线**（3.5~10px × 36~114px）换成
       * **细笔短段**（1.2~1.9px × 8~24px）+ 三遍不同角度。
       */
      /* ‼ strength 0.56 = 两层排线，缝里会透出纸色（#E8DCBE 很亮），
       *   在墙上就是密密麻麻的**白点/霉斑**（GG1~GG3 都毁在这）。
       *   0.74 走三层，排线才密到不透纸。 */
      brush.mass('wax', '#9A998F', { strength: 0.74, precision: 0.66 });
      brush.rect(0, 0, N, N); brush.noMass();

      const ang = -0.52;
      brush.clip([0, 0, N, N]);
      /* 三遍：每遍基准角差 0.16rad（约 9°），叠出来才有交叉；
       * 单遍的笔只抖 ±0.11rad，否则方向一散就成"毛毡"。 */
      for (let p = 0; p < 3; p++) {
        const ap = ang + (p - 1) * 0.16;
        const nb = p === 1 ? 260 : 200;
        for (let i = 0; i < nb; i++) {
          const x0 = rnd() * N, y0 = rnd() * N;
          const a = ap + (rnd() - 0.5) * 0.22;
          const len = 10 + rnd() * 18;
          /* 明暗笔：三成亮、一成半暗。细笔必须把对比拉开一档，
           * 否则 1.5px 的线混进底里就看不见（粗笔时代 ±0 都够）。 */
          const r = rnd();
          /* ‼ 亮笔不能太白（#A9A89C 在暗底上成雪点/霉斑），只比主色亮一档；
           *   暗笔同理，压太多就成了"黑划痕"。 */
          /* ‼ 不要亮笔。细笔 + 亮色在暗底上必然成"白点/霉斑"（GG1/GG2 都是），
           *   参考图里没有这种亮斑——蜡笔把纸压暗，只会更深，不会更亮。 */
          const col = r < 0.38 ? '#78776F' : P.cold;
          brush.set('hair', col, 1.15 + rnd() * 0.55);
          brush.line(x0, y0, x0 + Math.cos(a) * len, y0 + Math.sin(a) * len);
        }
      }
      brush.noClip();

      /* 块间明暗：四成石头压暗一档（整面画的墙必须有这个层次，
       * 否则所有砖一个值，缝一勾就成了"网格纸"）。 */
      for (let r = 0; r < 4; r++) {
        const off = (r % 2) * 48;
        for (let x = off - 96; x < N + 96; x += 96) {
          if (rnd() < 0.22) {
            brush.mass('crayon', P.cold, { strength: 0.42, precision: 0.76 });
            brush.rect(x + 1, r * 48 + 1, 94, 46);
            brush.noMass();
          }
        }
      }
    } else if (COAT === 'EE') {
      /* ## 整面画，不逐块画（2026-11-25 定版）
       *
       * 逐块涂的死结：一块砖只有 96×48 = 4600 像素，任何看得见的笔触
       * (4~6px 宽) 都占它 1/10 面积，稍微拉点对比就读成"贴上去的一道"；
       * 不拉对比又融进底里看不见。试了 15 个变体都是这两头。
       *
       * 参考图 p6_crayon 的城堡是**整块形体一次画完**：长笔触跨过整个屋顶，
       * 砖/瓦的缝是最后用暗线勾的结构，不是"每块各涂各的"。
       * 石墙照这个做：整面长笔触 → 再勾砖缝。
       */
      brush.mass('wax', P.cold, { strength: 0.50, precision: 0.70 });
      brush.rect(0, 0, N, N); brush.noMass();

      const ang = -0.52;
      brush.clip([0, 0, N, N]);
      for (let i = 0; i < 80; i++) {
        const x0 = rnd() * N, y0 = rnd() * N;
        const a = ang + (rnd() - 0.5) * 0.70;
        const len = 36 + rnd() * 78;
        /* 三成用亮一档、两成用暗一档 —— 这才是参考图的"明暗笔"。
         * 逐块涂时同样的笔会成"胶带"，整面画时它只是"墙面上的一道亮/暗"。 */
        const r = rnd();
        const col = r < 0.26 ? '#96958B' : (r < 0.38 ? '#7A7972' : P.cold);
        brush.set('wax', col, 3.5 + rnd() * 6.5);
        brush.line(x0, y0, x0 + Math.cos(a) * len, y0 + Math.sin(a) * len);
      }
      brush.noClip();

      /* 石头之间的整体明暗。
       * ‼ 不能用宽笔划一道来"压深"——22~36px 的笔在 48px 高的砖上就是一整块黑。
       *   变深只有一条路：**同一支笔多涂一遍**（mass 一遍，crayon）。 */
      for (let r = 0; r < 4; r++) {
        const off = (r % 2) * 48;
        for (let x = off - 96; x < N + 96; x += 96) {
          if (rnd() < 0.22) {
            brush.mass('crayon', P.cold, { strength: 0.42, precision: 0.76 });
            brush.rect(x + 1, r * 48 + 1, 94, 46);
            brush.noMass();
          }
        }
      }
    } else {
      for (let r = 0; r < 4; r++) {
        const off = (r % 2) * 48;
        for (let x = off - 96; x < N + 96; x += 96) {
          /* 石头之间的基色差：四成石头亮一档、三成暗一档。
           * ‼ 全部同色时，靠笔触叠出来的差别只有 ±10%，整面墙还是"一个色"。 */
          const q = rnd();
          const b = q < 0.40 ? '#A4A398' : (q < 0.72 ? '#9C9B90' : '#96958A');
          stone(x, r * 48, 96, 48, b);
        }
      }
    }
    /* 缝：两道 —— 一道宽炭线（沟），一道窄深线（投影）。
     * 单线读成"描边"，两道才有"砌进去"的深度。 */
    /* ‼ 缝宽从 1.8 提到 2.6、wiggle 0.16→0.30：
     *   参考图石头的轮廓是**粗炭笔抖线**，边缘毛糙、宽窄不一。
     *   1.8px 的规整细线读成"描边"或"贴图接缝"，是"非手绘感"的最后一道破绽。 */
    brush.set('seam', P.charcoal, 2.2);
    brush.wiggle(0.30);
    for (let r = 0; r <= 4; r++) brush.line(-6, r * 48, N + 6, r * 48);
    for (let r = 0; r < 4; r++) {
      const off = (r % 2) * 48;
      for (let x = off; x < N + 0.1; x += 96) brush.line(x, r * 48 + 2, x, (r + 1) * 48 - 2);
    }
    brush.set('seam', P.charcoal, 1.2);
    for (let r = 0; r <= 4; r++) brush.line(-6, r * 48 + 1.2, N + 6, r * 48 + 1.2);
    brush.noField();

    /* 整面脏：两三片很淡的土褐，位置随机。这是唯一"跨石头"的层，
     * 有了它，四块石头才是一面墙而不是四块贴图。 */
    /* ‼ 这一层是"跨石头的脏"，目的只是让四块石头连成一面墙。
     *   上一版用两片整块 mass 压土褐，在薄涂的墙上直接跳成"橙色斑块"——
     *   墙的主色是冷灰，土褐只要成片出现就抢戏。
     *   改成几道很淡的斜短线：面积小、笔淡，只在缝附近留一点温度。 */
    /* ‼ 2.5~6.5px × 14~40px 的土褐线在整面墙上一眼就是"棕色补丁"（实拍验证过）。
     *   跨石头的脏只需要"若有若无"：细、短、少。 */
    for (let i = 0; i < 2; i++) {
      const sx = rnd() * N, sy = rnd() * N;
      brush.set('wax', P.umber, 1.3 + rnd() * 1.1);
      brush.line(sx, sy, sx + 6 + rnd() * 9, sy + (rnd() - 0.5) * 4);
    }
  } else {
    /* 地面：一整行石砌，宽度组合凑满 192。
     * 横向 192 周期（4 格）、纵向 48（1 格），所以竖缝的相位只需对齐 192，
     * 横缝就是瓦片的上下边界本身 —— 平铺时天然连续，不用额外对齐。 */
    const WS = [[96, 96], [96, 96], [64, 64, 64], [80, 112], [112, 80],
                [48, 80, 64], [64, 80, 48]];
    const ws = WS[Math.floor(rnd() * WS.length)];
    let x = -192, wi = 0;
    while (x < N + 192) {
      stone(x, 0, ws[wi % ws.length], 48, P.cold);
      x += ws[wi % ws.length]; wi++;
    }
    /* 竖缝 */
    brush.set('seam', P.charcoal, 1.6);
    brush.wiggle(0.15);
    let x2 = -192, wi2 = 0;
    while (x2 < N + 192) {
      brush.line(x2, 2, x2, 46);
      x2 += ws[wi2 % ws.length]; wi2++;
    }
    brush.noField();
    /* 横缝：只画 y=0 这一条。y=48 由下一块瓦片的 y=0 提供，
     * 自己再画一条会在拼接处变成双线。 */
    brush.set('seam', P.charcoal, 1.6);
    brush.line(-6, 0, N + 6, 0);
    /* 地面碎屑：赭金的小点，踩出来的脏。 */
    brush.set('crayon', P.ochre, 1.3);
    for (let i = 0; i < 10; i++) {
      const sx = rnd() * N, sy = rnd() * H;
      brush.line(sx, sy, sx + 2 + rnd() * 5, sy + (rnd() - 0.5) * 2);
    }
  }
}

try {
  brush.createCanvas(N, H);
  brush.angleMode(brush.DEGREES);
  brush.clear(P.paper);
  brush.translate(-N / 2, -H / 2);
  for (const [ox, oy] of [[0,0],[-N,0],[N,0],[0,-H],[0,H],[-N,-H],[-N,H],[N,-H],[N,H]]) {
    brush.seed(3000 + S);
    brush.noiseSeed(4000 + S);
    brush.push();
    brush.translate(ox, oy);
    paint();
    brush.pop();
  }
  brush.render();
  window.__ok = true;
} catch (e) { window.__err = String(e && e.stack || e); console.error(e); }
</script>
