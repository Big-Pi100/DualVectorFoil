<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07070b">
<title>二向箔 · DEMO</title>
<style>
  :root{
    --bg:#07070b; --panel:rgba(18,16,24,.82); --line:rgba(255,255,255,.09);
    --ink:#e8e2d2; --dim:#8b8478; --gold:#ffd75e;
    --red:#e8735a; --blue:#6fa8dc; --yellow:#d8b24a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;
    overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  /* 用 flex 把 960×540 的舞台居中，缩放只交给 transform:scale()
     —— 别用 translate(-50%,-50%)，它按未缩放尺寸算，一加 scale 就偏。 */
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;flex:0 0 auto;width:960px;height:540px;transform-origin:center center;
    box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.7);border-radius:10px;overflow:hidden}
  canvas#cv{display:block;width:960px;height:540px;image-rendering:pixelated}

  /* ---------- 顶栏 ---------- */
  #top{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:12px;
    padding:0 14px;background:linear-gradient(180deg,rgba(6,6,10,.85),rgba(6,6,10,0));pointer-events:none}
  #title{font-weight:700;letter-spacing:3px;font-size:14px;color:#cfc7b0}
  #title small{font-weight:400;letter-spacing:1px;color:#6d675d;margin-left:8px}
  #skinwrap{margin-left:auto;display:flex;align-items:center;gap:8px;pointer-events:auto}
  #skinlabel{font-size:11px;color:var(--dim);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{font-size:11px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer}
  .btn:hover{background:rgba(255,255,255,.12)}

  /* ---------- 血槽 ---------- */
  #bars{position:absolute;left:14px;top:52px;width:250px}
  .bar{height:11px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;
    border:1px solid rgba(255,255,255,.10);margin-bottom:6px}
  .bar i{display:block;height:100%;transition:width .12s linear}
  #hpfill{background:linear-gradient(90deg,#b23a2e,#e8735a)}
  #mpfill{background:linear-gradient(90deg,#2f5f8f,#6fa8dc)}
  .barlabel{font-size:10px;color:var(--dim);letter-spacing:1px;margin-bottom:2px}

  /* ---------- 房间名 / 魂槽 ---------- */
  #roomname{position:absolute;left:14px;top:112px;font-size:12px;letter-spacing:2px;color:#b8ae98}
  #main{position:absolute;right:14px;top:52px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .slot{font-size:11px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);
    background:var(--panel);min-width:104px;text-align:right;letter-spacing:.5px}
  .slot.empty{color:#5c574e}
  .slot.red{border-color:rgba(232,115,90,.55);color:#f0a294}
  .slot.blue{border-color:rgba(111,168,220,.55);color:#a8cdea}
  .slot.yellow{border-color:rgba(216,178,74,.55);color:#e6cf92}
  #soulcount{font-size:10px;color:var(--dim);margin-top:2px}

  /* ---------- 小地图 ---------- */
  #minimap{position:absolute;right:14px;bottom:14px;width:150px;height:120px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px}

  /* ---------- 日志 ---------- */
  #log{position:absolute;left:14px;bottom:14px;width:330px;font-size:11px;color:#8f887c;line-height:1.7}
  #log div{opacity:.95}

  /* ---------- 按键提示 ----------
     放右下角小地图左边：左下有日志、右下有地图，中间这块正好空着。
     两行分开写左手/右手，因为"WSAD 管方向、右边六个键管动作"这件事
     本身就是键位的全部逻辑，不该挤成一行小字。 */
  #keys{position:absolute;right:178px;bottom:12px;text-align:right;
    font-size:11px;color:#5f5a51;letter-spacing:.5px;white-space:nowrap;line-height:20px}
  #keys .k{display:inline-block;min-width:13px;padding:1px 4px;margin-left:7px;
    border:1px solid #4a443a;border-radius:3px;color:#c9bfa8;font-weight:600;
    font-style:normal;line-height:14px;text-align:center;font-size:10px;
    background:rgba(255,255,255,.035)}
  #keys .hand{color:#8b8272;margin-left:0}
  #keys .pair{color:#4b453c;margin:0 2px}

  /* ---------- 菜单 ---------- */
  #menu{position:absolute;inset:0;display:none;padding:56px 60px;overflow:auto;
    background:rgba(5,5,9,.93);backdrop-filter:blur(2px)}
  #menu.show{display:block}
  #menu h2{font-size:15px;letter-spacing:4px;margin:0 0 4px;color:var(--gold);font-weight:600}
  #menu .sub{font-size:11px;color:var(--dim);margin-bottom:18px}
  .grp{font-size:11px;letter-spacing:2px;margin:16px 0 8px;color:#9a9284}
  .grp.red{color:#f0a294}.grp.blue{color:#a8cdea}.grp.yellow{color:#e6cf92}.grp.silver{color:#c8b6f0}
  .none{font-size:11px;color:#57534c;margin:0 0 6px}
  #souls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  #souls .grp,#souls .none{grid-column:1/-1}
  .soul{text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--ink);font:inherit}
  .soul b{display:block;font-size:12px;margin-bottom:3px}
  .soul span{font-size:10.5px;color:#8b8478;line-height:1.4;display:block}
  .soul.on{background:rgba(255,215,94,.10);border-color:rgba(255,215,94,.55)}
  .soul.red.on{border-color:rgba(232,115,90,.75);background:rgba(232,115,90,.12)}
  .soul.blue.on{border-color:rgba(111,168,220,.75);background:rgba(111,168,220,.12)}
  .soul.yellow.on{border-color:rgba(216,178,74,.75);background:rgba(216,178,74,.12)}
  .silveritem{grid-column:1/-1;font-size:12px;padding:10px 12px;border-radius:8px;
    border:1px solid rgba(200,182,240,.35);background:rgba(200,182,240,.08)}
  .silveritem b{color:#d8c8ff;margin-right:8px}
  .silveritem span{font-size:10.5px;color:#8b8478}

  /* ================= 触屏层（只在移动端出现） ================= */
  #pad{position:fixed;inset:0;z-index:50;pointer-events:none;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #stickzone{position:absolute;left:0;bottom:0;width:46%;height:74%;pointer-events:auto}
  /* --- 右手按钮：只按 AoS 的物理键来排，不按"哪个舒服"来排 ---
     跳和攻是两个大键（原版 A/B），红魂/蓝魂是两个中键（原版 上+B / R），
     后跃是最小的（原版 L，能力键，用得最少）。
     位置按拇指的自然扇形：右下角是拇指落点，所以跳最大、最靠角；
     越往左上越小、越少用。四个角都在 240×240 里，间隔 ≥8px，
     不会出现"按跳的时候指腹蹭到蓝魂"。 */
  #btns{position:absolute;right:calc(8px + env(safe-area-inset-right, 0px));
    bottom:calc(8px + env(safe-area-inset-bottom, 0px));width:240px;height:240px;pointer-events:none;
    transition:opacity .15s}
  #pad.hideplay #btns,#pad.hideplay #stickzone{opacity:0;pointer-events:none}

  #stick{position:fixed;left:-999px;top:-999px;width:112px;height:112px;margin:-56px 0 0 -56px;
    border-radius:50%;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);
    opacity:0;transition:opacity .12s;pointer-events:none}
  #stick.on{opacity:1}
  #stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
    border-radius:50%;background:rgba(255,215,94,.5);border:1.5px solid rgba(255,215,94,.9)}

  .pb{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;
    border:1.5px solid rgba(255,255,255,.22);background:rgba(16,14,22,.58);color:#e8e2d2;
    font:600 15px/1 "PingFang SC","Microsoft YaHei",sans-serif;backdrop-filter:blur(2px);
    -webkit-tap-highlight-color:transparent}
  .pb.on{background:rgba(255,215,94,.24);border-color:rgba(255,215,94,.8);color:#fff5d0}
  #pbJump{right:0;bottom:0;width:92px;height:92px;font-size:19px}
  #pbAtk{right:100px;bottom:8px;width:80px;height:80px;font-size:17px}
  #pbBlue{right:30px;bottom:104px;width:64px;height:64px;font-size:13px}
  #pbRed{right:104px;bottom:96px;width:64px;height:64px;font-size:13px}
  #pbBack{right:60px;bottom:176px;width:52px;height:52px;font-size:12px;
    border-color:rgba(255,255,255,.15);color:#b9b2a2}
  /* 魂匣放右上角：右手五键占满右下角，塞进去必被"跳"蹭到；
   * 顶部正中会压住 say() 的那行字幕（字幕画在 canvas 上，躲不开 DOM）。
   * 右上角在魂槽上方，是唯一一块既不抢手、也不挡字的地方。 */
  #pbMenu{position:fixed;right:calc(14px + env(safe-area-inset-right, 0px));
    top:calc(0px + env(safe-area-inset-top, 0px));
    width:46px;height:46px;font-size:13px;z-index:60}

  #touchhint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;
    padding:9px 16px;border-radius:10px;background:rgba(8,7,12,.82);color:#cfc7b0;
    font-size:13px;letter-spacing:1px;pointer-events:none;transition:opacity .5s}
  #touchhint.off{opacity:0}

  #rot{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
    background:#07070b;color:#b8ae98;font-size:15px;letter-spacing:4px}
  #rot.show{display:flex}

  /* ================= iPhone 安全区 =================
     刘海/灵动岛在横屏下吃掉左右各 ~47pt，Home 指示条吃掉底部 ~21pt。
     舞台是满屏铺开的（不缩进），所以只能把 HUD 往内推 —— 推多少要除以缩放比，
     因为舞台内的坐标是被 transform:scale() 缩过的。--s 由 mobile.js 写入。 */
  :root{
    --s:1;
    --sl:calc(env(safe-area-inset-left, 0px) / var(--s));
    --sr:calc(env(safe-area-inset-right, 0px) / var(--s));
    --st:calc(env(safe-area-inset-top, 0px) / var(--s));
    --sb:calc(env(safe-area-inset-bottom, 0px) / var(--s));
  }

  /* 手机上把给键鼠看的元素撤掉，HUD 放大一号（屏幕被缩到 0.72 倍，字号得补回来） */
  #stage.touch #keys,#stage.touch #log{display:none}
  #stage.touch #title small{display:none}
  #stage.touch #skinwrap{display:none}          /* 换肤挪进魂匣菜单，别占顶部 */
  #stage.touch #top{height:52px;padding-top:8px}
  #stage.touch #title{font-size:16px;letter-spacing:4px}
  #stage.touch #bars{width:266px;top:calc(58px + var(--st));left:calc(16px + var(--sl))}
  #stage.touch .bar{height:15px;margin-bottom:8px}
  #stage.touch .barlabel{font-size:13px}
  #stage.touch #roomname{font-size:15px;top:calc(132px + var(--st));left:calc(16px + var(--sl))}
  #stage.touch #main{top:calc(58px + var(--st));right:calc(16px + var(--sr));gap:8px}
  #stage.touch #main .slot{font-size:13px;padding:8px 11px;min-width:120px}
  #stage.touch #soulcount{font-size:12px}
  #stage.touch #menu{padding:64px 56px}
  /* 小地图原本在右下，正好被跳/攻挡住 —— 挪到左边竖排 */
  #stage.touch #minimap{right:auto;left:calc(12px + var(--sl));top:calc(172px + var(--st));
    width:114px;height:90px;opacity:.74}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>

  <div id="top">
    <div id="title">二向箔 <small>DEMO · 装裱的长廊</small></div>
    <div id="skinwrap">
      <span id="skinlabel">相册里的一张</span>
      <button class="btn" id="skinbtn">按快门</button>
      <button class="btn" id="skinreset">换回名片</button>
      <input type="file" id="skinf" accept="image/*" hidden>
    </div>
  </div>

  <div id="bars">
    <div class="barlabel">HP</div>
    <div class="bar"><i id="hpfill" style="width:100%"></i></div>
    <div class="barlabel">MP</div>
    <div class="bar"><i id="mpfill" style="width:100%"></i></div>
  </div>
  <div id="roomname">废墟回廊</div>

  <div id="main">
    <div class="slot empty" id="slotred">空</div>
    <div class="slot empty" id="slotblue">空</div>
    <div class="slot empty" id="slotyellow">空</div>
    <div id="soulcount">1/5</div>
  </div>

  <canvas id="minimap" width="150" height="120"></canvas>
  <div id="log"></div>
  <div id="keys">
    <div><span class="hand">左手</span><i class="k">W</i><i class="k">A</i><i class="k">S</i><i class="k">D</i> 移动 · 蹲 · 抬头</div>
    <div><span class="hand">右手</span><i class="k">J</i>攻<i class="k">U</i>红魂<span class="pair">·</span><i class="k">K</i>跳<i class="k">I</i>后跃<span class="pair">·</span><i class="k">L</i>蓝魂<i class="k">O</i>魂匣</div>
  </div>

  <div id="menu">
    <h2>魂 之 匣</h2>
    <div class="sub">红/蓝/黄 各装一个；银魂是能力，拿到就永久生效。点一下装备，再点一下卸下。</div>
    <div id="souls"></div>
  </div>
</div>

        noise(0.03, 0.03, 'highpass', 3200, 0.7);
        break;
      case 'jump':
        tone(300, 0.10, 0.055, 'sine', 470);
        noise(0.09, 0.028, 'highpass', 1800, 0.8);
        break;
      case 'djump':
        tone(430, 0.13, 0.06, 'triangle', 700);
        noise(0.12, 0.035, 'highpass', 2400, 0.8);
        break;
      case 'swing':                      // 出拳：布被划开，不是金属
        var s = noise(0.13, 0.075, 'bandpass', 1700, 0.9);

        s.f.frequency.exponentialRampToValueAtTime(520, s.t + 0.13);

      case 'hit':
        noise(0.06, 0.10, 'highpass', 1400, 0.7);
        tone(190, 0.10, 0.16, 'sine', 62);       // 闷的低音才是"打实了"
        break;
      case 'hurt':
        tone(240, 0.20, 0.10, 'sawtooth', 92);
        noise(0.10, 0.06, 'bandpass', 900, 1.2);
        break;
      case 'land':
        tone(105, 0.11, 0.10, 'sine', 46);
        noise(0.07, 0.045, 'lowpass', 700, 0.8);
        break;
      case 'slam':
        tone(78, 0.22, 0.14, 'sine', 34);
        noise(0.14, 0.06, 'lowpass', 480, 0.7);
        break;
      case 'pickup':                     // 拾取：两声，第二声高一个五度
        tone(659.25, 0.45, 0.055, 'sine');
        tone(987.77, 0.55, 0.040, 'sine');

        noise(0.018, 0.20, 'highpass', 2600, 0.8);

        tone(180, 0.5, 0.06, 'triangle', 300);
        break;
      case 'death':

    musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(0.0001, t);
    musicBus.gain.linearRampToValueAtTime(0.5, t + 3.0);
  }

    var t = now();
    while (nextNote < t + 0.5) {
      var f = SCALE[Math.floor(Math.random() * SCALE.length)];
      // 旋律只走高音区（×2），低音区留给持续层，避免糊在一起
      var o = ctx.createOscillator();
      o.type = Math.random() < 0.3 ? 'triangle' : 'sine';
      o.frequency.value = f * 2;
      var g = ctx.createGain();
      var dur = 2.2 + Math.random() * 1.8;
      g.gain.setValueAtTime(0.0001, nextNote);
      g.gain.linearRampToValueAtTime(0.030 + Math.random() * 0.014, nextNote + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, nextNote + dur);
      o.connect(g);
      g.connect(musicBus);
      g.connect(verb);
      o.start(nextNote); o.stop(nextNote + dur + 0.05);

      // 偶尔补一个低八度，像影子
      if (Math.random() < 0.35) {
        var o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f;
        var g2 = ctx.createGain();
        g2.gain.setValueAtTime(0.0001, nextNote);
        g2.gain.linearRampToValueAtTime(0.018, nextNote + 0.03);
        g2.gain.exponentialRampToValueAtTime(0.0001, nextNote + dur * 1.2);
        o2.connect(g2); g2.connect(verb);
        o2.start(nextNote); o2.stop(nextNote + dur * 1.2 + 0.05);

    }
  }

    muted = !!v;
    if (!master) return;
    var t = now();

  /* ---------------- 启动 ---------------- */
  // iOS：AudioContext 必须在用户手势里创建/恢复，且受静音拨片影响（Web 无解，需提示）
  function unlock() {

    unlock: unlock,
    sfx: play,
    mute: setMuted,
    isMuted: function () { return muted; },

    window.addEventListener(ev, unlock, { once: true, passive: true });
  });
})();

<script>
/* 魂之城 · Soul Keep
 * AoS（晓月圆舞曲）模式的玩法内核原型
 * ------------------------------------------------------------------
 * 只做三件事，每件都要能换成真素材：
 *   1. 房间探索 + 能力门（拿魂 → 解锁 → 回头开门）
 *   2. 三类魂装备（红/蓝/黄）+ 银魂（能力魂，永久）
 *   3. 皮肤包（skin pack）：主角/怪物的视觉可整体替换，碰撞体不变
 * 美术默认用名片管线导出的 atlas（同一份 atlas.json），换照片走 dyn 包。

'use strict';

 * 与其裁掉视野，不如让它多看一段 —— 触屏本来就该多看。 */

/* ==================== 手感预设 ====================
 * 恶魔城（晓月）和现代平台游戏不是"参数大小"的区别，是设计哲学的区别。
 *

 *   4. 松手时上升速度被硬压到 -1.0 像素/帧，是**绝对值切断**，不是乘系数
 *   5. 走路每帧先 RicDecelerateX(FIX(0.125)) 再 RicSetSpeedX(FIX(1.25)) ——
 *      恒速是"每帧重设"，不是"没有摩擦"。松手后仍在减速，要 10 帧才停。

 * ── 恶魔城没有的东西 ──
 * 土狼时间、跳跃缓冲、顶点重力打折。这三个都是后来的游戏为了让玩家"别摔死"
 * 加的宽容设计，GBA 上的恶魔城一个都没有。去掉了操作会变"硬" —— 那正是它的手感。
 *
 * ── 换算（全部按 1 格 = 16px → 我们 48px，倍数 3）──

const PACK_ATLAS = {
  kind:'atlas', label:'名片角色（默认）',
  /* 状态名对齐源码的 step：stand / walk / jump / fall / crouch / slide / attack / cast / hurt。
   * 名片管线只有 idle/walk/attack/wave/hit 五组动画，缺的走 fallback（jump→idle 等），
   * 这是皮肤包本来的设计 —— 一张照片生成 1 帧也能玩。 */
  /* map.walk 必须指向**真实存在的动画**。上一版写 'walk'，而名片管线只导出
   * idle/wave/attack/kick/hit 五组 —— animFrames('walk') 返回空数组，drawAtlasFrame
   * 在 `!frames.length` 那里直接 return，于是**一走路整个人就消失了**。
   * 这个 bug 很阴：站着正常、跳正常、只有走的时候没有，会让人以为"走路状态坏了"。
   * 现在走 idle 帧 + 程序化步态（见 renderPlayer 的 walkPhase），缺素材也能读成"在走"。 */
  map: { stand:'idle', idle:'idle', walk:'idle', jump:'idle', fall:'idle',
         crouch:'idle', slide:'idle', attack:'attack', cast:'wave', hurt:'hit',
         dash:'idle' },
};
let atlasImg = null, atlasMan = null;

function animFrames(n) { const a = atlasMan && atlasMan.animations[n]; return a ? a.frames : []; }
function animFps(n)    { const a = atlasMan && atlasMan.animations[n]; return a ? a.fps : 6; }

function drawAtlasFrame(ctx, anim, t, feetX, feetY, height, flip, fixIdx) {
  if (!atlasImg || !atlasMan) return;
  const frames = animFrames(anim);
  if (!frames.length) return;
  let i;
  if (fixIdx != null) i = Math.min(fixIdx, frames.length - 1);
  else {
    const loop = atlasMan.animations[anim].loop;
    i = Math.floor(t * animFps(anim));
    i = loop ? i % frames.length : Math.min(i, frames.length - 1);
  }
  const fr = atlasMan.frames[frames[i]].frame;
  const k = height / fr.h;
  const pv = atlasMan.meta.pivot;
  const ax = flip ? (fr.w - pv.x) : pv.x;
  const dx = feetX - ax * k, dy = feetY - pv.y * k;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flip) { ctx.translate(feetX, 0); ctx.scale(-1, 1); ctx.translate(-feetX, 0); }
  ctx.drawImage(atlasImg, fr.x, fr.y, fr.w, fr.h, dx, dy, fr.w * k, fr.h * k);
  ctx.restore();
}

const PACK_PHOTO = { kind:'dyn', label:'你拍的（本地显影）', canvas:null, w:0, h:0 };

function buildPhotoPack(file, done) {
  const img = new Image();
  img.onload = () => {
    const H = 96;
    const W = Math.max(1, Math.round(img.width * (H / img.height)));
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const c = off.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.drawImage(img, 0, 0, W, H);
    const im = c.getImageData(0, 0, W, H), d = im.data;
    const cAt = i => [d[i], d[i+1], d[i+2]];
    const cs = [cAt(0), cAt((W-1)*4), cAt((H-1)*W*4), cAt(((H-1)*W+W-1)*4)];
    const bg = [0,1,2].map(ch => Math.round(cs.reduce((s,v)=>s+v[ch],0)/4));
    let minX = W, maxX = 0, minY = H, maxY = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y*W + x) * 4;
      const dist = Math.abs(d[i]-bg[0]) + Math.abs(d[i+1]-bg[1]) + Math.abs(d[i+2]-bg[2]);
      if (dist < 60) { d[i+3] = 0; continue; }
      d[i] &= 0xE0; d[i+1] &= 0xE0; d[i+2] &= 0xE0; d[i+3] = 255;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
    if (maxX >= minX) {
      const w2 = maxX - minX + 1, h2 = maxY - minY + 1;
      const cut = document.createElement('canvas');
      cut.width = w2; cut.height = h2;
      cut.getContext('2d').putImageData(c.getImageData(minX, minY, w2, h2), 0, 0);
      PACK_PHOTO.canvas = cut; PACK_PHOTO.w = w2; PACK_PHOTO.h = h2;
    } else {
      PACK_PHOTO.canvas = off; PACK_PHOTO.w = W; PACK_PHOTO.h = H;
    }
    done && done(true);
  };
  img.onerror = () => done && done(false);
  img.src = URL.createObjectURL(file);
}

function drawPhotoFrame(ctx, feetX, feetY, height, flip, state, t) {
  const c = PACK_PHOTO.canvas;
  if (!c) return;
  const k = height / PACK_PHOTO.h;
  let bob = 0, sq = 1;
  if (state === 'walk') { bob = -Math.abs(Math.sin(t * 10)) * 4; sq = 1 + Math.sin(t * 20) * 0.02; }
  if (state === 'attack') { bob = -3; }
  if (state === 'hurt') { bob = 2; }
  const w = PACK_PHOTO.w * k * sq, h = PACK_PHOTO.h * k / sq;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (flip) { ctx.translate(feetX, 0); ctx.scale(-1, 1); ctx.translate(-feetX, 0); }
  ctx.drawImage(c, feetX - w/2, feetY - h + bob, w, h);
  ctx.restore();
}
